<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free download — HORIZON RCRDS</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon_icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --acc: #ff5500; --bg: #08080a; --text: #f4f4f5; --soft: #a9a9b2; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--bg); color: var(--text); font: 400 16px/1.6 'Barlow', system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  #bg { position: fixed; inset: -60px; background-size: cover; background-position: center; filter: blur(60px) saturate(1.4) brightness(.5); transform: scale(1.15); z-index: -2; opacity: 0; transition: opacity .6s; }
  #bg.on { opacity: 1; }
  #tint { position: fixed; inset: 0; background: radial-gradient(120% 80% at 50% 0%, transparent, rgba(0,0,0,.5) 65%, rgba(0,0,0,.92)); z-index: -1; }
  /* la H de Horizon repetida, muy sutil */
  #pattern { position: fixed; inset: 0; background-image: url(/assets/logo.png); background-repeat: repeat; background-position: center; background-size: 42px; opacity: .022; z-index: -1; pointer-events: none; }
  main { --w: min(92vw, 52vh); width: 100%; min-height: 100dvh; margin: 0 auto; padding: 12px 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 0; }
  .brand { display: inline-flex; align-items: center; gap: 9px; color: #fff; text-decoration: none; margin-bottom: 12px; opacity: .9; }
  .brand img { height: 22px; }
  .brand span { font: 400 16px/1 'Bebas Neue', sans-serif; letter-spacing: .16em; margin-right: -.16em; }
  .cover { width: var(--w); aspect-ratio: 1; border-radius: 20px; object-fit: cover; background: #000;
    box-shadow: 0 30px 70px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.07), 0 16px 120px -10px var(--acc); }
  .eyebrow { margin: 18px 0 0; font: 700 11px/1 'Barlow', sans-serif; letter-spacing: .3em; text-transform: uppercase; color: var(--acc); }
  h1 { font: 400 clamp(34px, 9vw, 54px)/.9 'Bebas Neue', sans-serif; margin: 8px 0 1px; }
  .artist { color: var(--soft); font-size: 15px; margin: 0; }
  .unlock { margin: 16px 0 0; font-size: 14px; font-weight: 600; color: var(--text); }
  .unlock b { color: var(--acc); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 11px; width: var(--w); max-width: 460px; margin-top: 14px; padding: 15px 20px; border: 0; border-radius: 12px;
    font: 700 13px/1 'Barlow', sans-serif; letter-spacing: .1em; text-transform: uppercase; cursor: pointer; text-decoration: none; transition: transform .1s, box-shadow .2s, opacity .2s; }
  .btn:active { transform: translateY(1px); }
  .btn.sc { background: linear-gradient(180deg, #ff6a2b, #ff4d00); color: #fff; box-shadow: 0 14px 34px -8px rgba(255,80,0,.75); }
  .btn.sc:disabled { opacity: .5; box-shadow: none; cursor: default; }
  .btn.dl { background: #fff; color: #0a0a0b; box-shadow: 0 14px 36px -8px rgba(255,255,255,.45); }
  .note { margin: 11px 2px 0; font-size: 11px; line-height: 1.5; color: #7c7c85; max-width: var(--w); }
  .err { color: #ff6b6b; font-size: 13px; margin: 12px 0 0; }
  .ok-badge { display: inline-flex; align-items: center; gap: 7px; margin-top: 16px; color: #22c55e; font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
  .done-msg { color: var(--soft); font-size: 14px; margin: 8px 0 0; }
  .socials { display: flex; gap: 20px; justify-content: center; margin-top: 12px; }
  .socials a { color: #8a8a93; width: 22px; height: 22px; display: inline-flex; transition: color .2s, transform .1s; }
  .socials a:hover { color: var(--acc); transform: translateY(-2px); }
  .socials svg { width: 100%; height: 100%; }
  .follow-lbl { margin: 14px 0 0; font: 700 10px/1 'Barlow', sans-serif; letter-spacing: .26em; text-transform: uppercase; color: #6b6b74; }
  .foot { margin-top: 24px; font-size: 11px; letter-spacing: .1em; color: #6b6b74; }
  .foot a { color: var(--soft); text-decoration: none; }
  .msg { color: var(--soft); }
</style>
</head>
<body>
<div id="bg"></div><div id="pattern"></div><div id="tint"></div>
<main id="root"><p class="msg">Loading…</p></main>
<script>
(() => {
  const root = document.getElementById('root'), bg = document.getElementById('bg');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const id = (location.pathname.match(/^\/download\/([\w-]+)/) || [])[1] || '';
  const params = new URLSearchParams(location.search);
  const brand = '<a class="brand" href="/"><img src="/assets/logo.png" alt=""><span>HORIZON RCRDS</span></a>';
  const img = f => !f ? '' : /^(https?:|\/)/.test(f) ? f : '/assets/' + f;
  const scLogo = '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M1 15a1 1 0 0 0 2 0v-4a1 1 0 0 0-2 0zm3 1a1 1 0 0 0 2 0V9a1 1 0 0 0-2 0zm3 0a1 1 0 0 0 2 0V8a1 1 0 0 0-2 0zm3 .5a1 1 0 0 0 2 0V7a1 1 0 0 0-2 0zm3 0a1 1 0 0 0 2 0V8.5a1 1 0 0 0-2 0zM18 17h4a3 3 0 0 0 0-6 4.5 4.5 0 0 0-8.4-1.6V17z"/></svg>';
  const IG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.2c3.2 0 3.6 0 4.9.07 1.2.06 1.8.25 2.2.42.56.22.96.48 1.38.9.42.42.68.82.9 1.38.17.4.36 1 .42 2.2.07 1.3.07 1.7.07 4.9s0 3.6-.07 4.9c-.06 1.2-.25 1.8-.42 2.2a3.7 3.7 0 0 1-.9 1.38 3.7 3.7 0 0 1-1.38.9c-.4.17-1 .36-2.2.42-1.3.07-1.7.07-4.9.07s-3.6 0-4.9-.07c-1.2-.06-1.8-.25-2.2-.42a3.7 3.7 0 0 1-1.38-.9 3.7 3.7 0 0 1-.9-1.38c-.17-.4-.36-1-.42-2.2C2.2 15.6 2.2 15.2 2.2 12s0-3.6.07-4.9c.06-1.2.25-1.8.42-2.2.22-.56.48-.96.9-1.38.42-.42.82-.68 1.38-.9.4-.17 1-.36 2.2-.42C8.4 2.2 8.8 2.2 12 2.2zm0 1.8c-3.1 0-3.5 0-4.7.07-1.1.05-1.7.23-2.1.4-.5.2-.9.44-1.3.84-.4.4-.64.8-.84 1.3-.17.4-.35 1-.4 2.1-.06 1.2-.06 1.6-.06 4.3s0 3.1.06 4.3c.05 1.1.23 1.7.4 2.1.2.5.44.9.84 1.3.4.4.8.64 1.3.84.4.17 1 .35 2.1.4 1.2.06 1.6.07 4.7.07s3.5 0 4.7-.07c1.1-.05 1.7-.23 2.1-.4.5-.2.9-.44 1.3-.84.4-.4.64-.8.84-1.3.17-.4.35-1 .4-2.1.06-1.2.07-1.6.07-4.3s0-3.1-.07-4.3c-.05-1.1-.23-1.7-.4-2.1a3.5 3.5 0 0 0-.84-1.3 3.5 3.5 0 0 0-1.3-.84c-.4-.17-1-.35-2.1-.4C15.5 4 15.1 4 12 4zm0 3.1a4.9 4.9 0 1 1 0 9.8 4.9 4.9 0 0 1 0-9.8zm0 1.8a3.1 3.1 0 1 0 0 6.2 3.1 3.1 0 0 0 0-6.2zm5.1-.3a1.15 1.15 0 1 1-2.3 0 1.15 1.15 0 0 1 2.3 0z"/></svg>';
  const YT = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M23 7.5a3 3 0 0 0-2.1-2.1C19 4.9 12 4.9 12 4.9s-7 0-8.9.5A3 3 0 0 0 1 7.5 31 31 0 0 0 .5 12 31 31 0 0 0 1 16.5a3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 23.5 12 31 31 0 0 0 23 7.5zM9.8 15.3V8.7l5.7 3.3-5.7 3.3z"/></svg>';
  const SP = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm4.6 14.4a.62.62 0 0 1-.86.2c-2.35-1.43-5.3-1.76-8.8-.96a.62.62 0 1 1-.28-1.22c3.8-.87 7.1-.5 9.74 1.12.3.18.4.57.2.86zm1.23-2.73a.78.78 0 0 1-1.07.26c-2.7-1.66-6.8-2.14-10-1.17a.78.78 0 1 1-.45-1.5c3.65-1.1 8.17-.56 11.27 1.34.37.23.49.71.25 1.07zm.1-2.85C14.72 8.98 9.5 8.8 6.46 9.72a.94.94 0 1 1-.54-1.8c3.5-1.05 9.26-.85 12.9 1.31a.94.94 0 0 1-.96 1.62z"/></svg>';
  const SOCIALS = [['SoundCloud', 'https://soundcloud.com/horizonirecords', scLogo], ['Instagram', 'https://www.instagram.com/horizon_rcrds/', IG], ['YouTube', 'https://www.youtube.com/@HORIZONRCRDS', YT], ['Spotify', 'https://open.spotify.com/user/315n3grwllchjxzjrsem7uqv5bse', SP]];
  const socials = '<p class="follow-lbl">Follow HORIZON RCRDS</p><div class="socials">' + SOCIALS.map(([n, u, s]) => `<a href="${u}" target="_blank" rel="noopener" aria-label="${n}">${s}</a>`).join('') + '</div>';

  async function load() {
    if (!id) { root.innerHTML = brand + '<p class="msg">This download link is not valid.</p>'; return; }
    let d;
    try {
      const r = await fetch('/api/public/download/' + encodeURIComponent(id), { cache: 'no-store' });
      d = await r.json();
      if (!r.ok) throw new Error(d.message || 'This download is not available.');
    } catch (e) { root.innerHTML = brand + '<p class="msg">' + esc(e.message) + '</p>'; return; }

    if (d.color && /^#[0-9a-f]{3,6}$/i.test(d.color)) document.documentElement.style.setProperty('--acc', d.color);
    if (d.image) { bg.style.backgroundImage = `url("${img(d.image).replace(/"/g, '%22')}")`; bg.classList.add('on'); }
    document.title = (d.artist ? d.artist + ' – ' : '') + (d.title || 'Download') + ' — HORIZON RCRDS';

    const head = brand +
      (d.image ? '<img class="cover" src="' + esc(img(d.image)) + '" alt="">' : '') +
      '<h1 style="margin-top:20px">' + esc(d.title || 'Download') + '</h1>' +
      (d.artist ? '<p class="artist">' + esc(d.artist) + '</p>' : '');

    if (params.get('done') === '1') {
      root.innerHTML = head +
        '<span class="ok-badge"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>Download ready</span>' +
        '<a class="btn dl" href="/api/public/download/' + encodeURIComponent(id) + '/file">↓ Download the Extended Mix</a>' + socials;
      return;
    }
    const error = params.get('error');
    root.innerHTML = head +
      '<p class="unlock">Connect your SoundCloud to get the free <b>Extended Mix</b></p>' +
      '<button class="btn sc" id="go">' + scLogo + 'Connect with SoundCloud</button>' +
      (error ? '<p class="err">' + esc(error) + '</p>' : '') +
      '<p class="note">' + esc(d.notice || '') + '</p>' + socials;

    document.getElementById('go').addEventListener('click', e => { const b = e.currentTarget; b.disabled = true; b.textContent = 'Connecting…'; location.href = '/api/sc/login?r=' + encodeURIComponent(id); });
  }
  load();
  // al volver con «atrás» el navegador restaura la página congelada (botón en «Connecting…»): se vuelve a montar limpia
  addEventListener('pageshow', e => { if (e.persisted) load(); });
})();
</script>
</body>
</html>
