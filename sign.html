<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; base-uri 'none'; form-action 'none'">
<title>Contract — HORIZON RCRDS</title>
<link rel="icon" type="image/png" href="/assets/favicon_icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&family=Comfortaa:wght@300..700&family=Lexend:wght@100..900&family=Montserrat:wght@400;700&family=Roboto:wght@400;700&family=Allura&family=Dancing+Script:wght@500&family=Great+Vibes&family=Herr+Von+Muellerhoff&family=Mrs+Saint+Delafield&family=Sacramento&display=swap">
<style>
  :root { --bg: #050505; --line: #1f1f1f; --line-2: #2a2a2a; --text: #e5e7eb; --muted: #8b8f98; --accent: #ffffff; --accent-rgb: 255, 255, 255; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font: 400 16px/1.6 'Barlow', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  main { width: min(960px, 100%); margin: 0 auto; padding: 40px 16px 96px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
  .home { display: inline-flex; align-items: center; gap: 12px; color: #fff; text-decoration: none; }
  .home img { height: 32px; }
  .home span { font: 400 22px/1 'Bebas Neue', sans-serif; letter-spacing: .12em; }
  .status { padding: 6px 12px; border-radius: 3px; font-size: 11px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; border: 1px solid rgba(var(--accent-rgb), .5); color: var(--accent); }
  .status.ok { color: #fff; border-color: rgba(255, 255, 255, .5); }
  h1 { margin: 0 0 6px; font: 400 clamp(36px, 7vw, 56px)/.95 'Bebas Neue', sans-serif; color: #fff; }
  .sub { margin: 0 0 26px; color: var(--muted); }
  .docwrap { overflow-x: auto; margin: 0 -16px; padding: 0 16px; }
  .doc { width: 612pt; max-width: 100%; margin: 0 auto; background: #fff; color: #000; font-family: Arial, sans-serif; font-size: 11pt; line-height: normal; box-shadow: 0 2px 14px rgba(0,0,0,.5); }
  .doc, .doc * { box-sizing: content-box; }
  .doc p, .doc h1, .doc h2, .doc h3, .doc h4, .doc h5, .doc h6 { margin: 0; font-family: inherit; color: inherit; }
  .doc h1 { font-size: 20pt; } .doc h2 { font-size: 16pt; } .doc h3 { font-size: 14pt; }
  .doc ul, .doc ol { margin: 0; padding-left: 36pt; }
  .doc table { border-collapse: collapse; }
  .doc img { display: inline-block; max-width: none; }
  .doc > .sigblock { margin: 0 36pt; padding-bottom: 36pt; }
  .sigblock { margin-top: 26px; padding-top: 18px; border-top: 2px solid #111; font-family: Arial, sans-serif; }
  .sigblock h3 { margin: 0 0 8px; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; }
  .sigblock img { max-width: 320px; max-height: 120px; display: block; margin: 6px 0; }
  .typed-sig { font: italic 400 34px/1.2 'Brush Script MT', 'Segoe Script', cursive; margin: 6px 0; }
  .cert { font: 400 12px/1.5 'Courier New', monospace; color: #444; word-break: break-all; }
  .panel { margin-top: 26px; padding: 22px; border: 1px solid var(--line-2); border-radius: 10px; background: #0d0d0d; }
  .panel h2 { margin: 0 0 14px; font: 400 30px/1 'Bebas Neue', sans-serif; letter-spacing: .05em; color: #fff; }
  .field { margin-bottom: 14px; }
  .field label { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  input[type=text], input[type=email] { width: 100%; min-height: 46px; padding: 11px 14px; border-radius: 6px; background: #121212; border: 1px solid var(--line-2); color: var(--text); font: inherit; outline: none; }
  input:focus { border-color: rgba(var(--accent-rgb), .8); }
  .pad-wrap { position: relative; }
  canvas { display: block; width: 100%; height: 180px; border-radius: 6px; background: #fff; touch-action: none; cursor: crosshair; }
  .pad-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 13px; color: var(--muted); }
  .link-btn { background: none; border: 0; color: var(--accent); font: inherit; cursor: pointer; padding: 0; }
  .agree { display: flex; gap: 12px; align-items: flex-start; margin: 16px 0; cursor: pointer; }
  .agree input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); flex: none; }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 36px; border: 0; border-radius: 3px; background: var(--accent); color: #000; font: 700 13px/1 'Barlow', sans-serif; letter-spacing: .2em; text-transform: uppercase; cursor: pointer; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.ghost { background: none; color: #fff; border: 1px solid var(--line-2); }
  .err { color: #ffb4b6; margin: 10px 0 0; }
  .msg { color: var(--muted); }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
  .gate { width: min(460px, 100%); margin: 8vh auto 0; }
  .gate .actions .btn { width: 100%; }
  .gate-links { margin: 16px 0 0; text-align: center; font-size: 14px; }
  #g-code { text-align: center; font-size: 24px; letter-spacing: .4em; padding-left: calc(14px + .4em); }
  .ds-end { width: min(620px, 100%); margin: 32px auto 0; text-align: center; }
  .ds-end .actions { justify-content: center; }
  .ds-end .proof { text-align: left; }
  @media print {
    body { background: #fff; color: #111; }
    main { padding: 0; width: 100%; }
    .top, .sub, .panel, .actions, .no-print { display: none !important; }
    h1 { color: #111; font-size: 28px; }
    .doc { box-shadow: none; width: auto; }
  }
  .viewer { margin: 0 -16px; padding: 18px 16px; background: #2b2b2b; border-radius: 8px; }
  .pdf-box { border: 2px dashed rgba(0,0,0,.75); background: rgba(0,0,0,.05); border-radius: 3px; display: flex; flex-direction: column; justify-content: flex-end; }
  .pdf-box span { margin: auto; font: 700 11px/1 'Barlow', sans-serif; letter-spacing: .12em; text-transform: uppercase; color: #111; }
  .pdf-box.is-signed { border: 0; background: none; }
  .pdf-typed { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; font: italic 400 26px/1 'Brush Script MT', 'Segoe Script', cursive; color: #0d0d33; white-space: nowrap; overflow: hidden; }
  .pdf-sig-label { font: 400 8px/1.1 Arial, sans-serif; color: #444; }
  .proof { margin-top: 14px; padding: 14px 16px; border: 1px solid var(--line-2); border-radius: 8px; font-size: 14px; color: var(--text); }
  .proof code { font-size: 11px; color: var(--muted); word-break: break-all; }
  /* estilo DocuSign */
  .ds-bar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 0 -16px 22px; padding: 14px 16px; background: #111; border-bottom: 1px solid #fff; }
  .ds-bar.done { border-bottom-color: #fff; }
  .ds-bar p { margin: 0; color: #fff; font-size: 15px; }
  .ds-bar .btn { background: #fff; color: #000; min-height: 44px; flex: none; }
  .ds-bar.done .btn { background: #fff; }
  .pdf-box.is-active { border: 2px solid #111; background: rgba(0, 0, 0, .06); cursor: pointer; }
  .pdf-box.is-signed.is-active { border: 1px dashed rgba(0,0,0,.4); background: none; }
  .pdf-box.is-active.pulse { animation: ds-pulse .6s ease-in-out 3; }
  @keyframes ds-pulse { 50% { box-shadow: 0 0 0 8px rgba(0, 0, 0, .25); } }
  .pdf-box .pdf-flag { margin: 0; position: absolute; left: -2px; top: -2px; transform: translateY(-100%); padding: 5px 9px; border-radius: 3px 3px 0 0; background: #111; color: #fff; font: 700 10px/1 Arial, sans-serif; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
  .pdf-box:not(.is-active):not(.is-signed) { border: 1px dashed #9aa0aa; background: rgba(150, 150, 150, .08); }
  .pdf-box:not(.is-active):not(.is-signed) .pdf-flag { background: #d4d4d8; color: #111; }
  .ds-modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: rgba(0, 0, 0, .7); }
  .ds-card { width: min(560px, 100%); max-height: 92vh; overflow: auto; padding: 24px; border-radius: 10px; background: #fff; color: #111; }
  .ds-card h2 { margin: 0 0 4px; font: 700 22px/1.2 Arial, sans-serif; color: #111; }
  .ds-card .msg { color: #555; margin: 0 0 16px; }
  .ds-card .field label { color: #555; }
  .ds-card input[type=text], .ds-card input[type=email] { background: #fff; color: #111; border-color: #c9ccd3; }
  .ds-card input[readonly] { background: #f3f4f6; color: #555; }
  .ds-tabs { display: flex; gap: 4px; margin: 6px 0 12px; border-bottom: 1px solid #ddd; }
  .ds-tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px; font: 700 13px/1 Arial, sans-serif; color: #555; cursor: pointer; }
  .ds-tabs button.on { color: #111; border-bottom-color: #111; }
  .ds-styles { display: grid; gap: 8px; }
  .ds-style { text-align: left; padding: 12px 16px; border: 1px solid #ddd; border-radius: 6px; background: #fafafa; font-size: 34px; line-height: 1.25; font-style: normal; color: #0d0d33; cursor: pointer; overflow: hidden; white-space: nowrap; }
  .ds-style.on { border-color: #111; box-shadow: 0 0 0 2px rgba(0, 0, 0, .15); background: #f5f5f5; }
  .ds-card canvas { display: block; width: 100%; height: 170px; border: 1px solid #ddd; border-radius: 6px; background: #fff; touch-action: none; }
  .ds-card .pad-actions { color: #555; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .up-box { display: grid; place-items: center; min-height: 170px; padding: 14px; border: 1px dashed #c9ccd3; border-radius: 6px; background: #fafafa; color: #111; font: 700 13px/1.4 Arial, sans-serif; text-align: center; cursor: pointer; }
  .up-box img { max-width: 100%; max-height: 120px; object-fit: contain; margin-bottom: 10px; }
  .up-box:hover { border-color: #111; }
  .ds-card .agree { color: #333; font-size: 14px; }
  .ds-card .err { color: #c0262d; }
  .ds-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .ds-card .btn { background: #111; color: #fff; }
  .ds-card .link-btn { color: #111; text-decoration: underline; }
  .ds-card .agree input { accent-color: #111; }
  .ds-card .btn.ghost { background: none; color: #111; border: 1px solid #c9ccd3; }
    /* sin barras de scroll visibles (se sigue pudiendo desplazar) */
    html, body, * { scrollbar-width: none; }
    ::-webkit-scrollbar { display: none; width: 0; height: 0; }
</style>
</head>
<body>
<main>
  <div class="top"><a class="home" href="/"><img src="/assets/logo.png" alt=""><span>HORIZON RCRDS</span></a><span id="status"></span></div>
  <div id="root"><p class="msg">Loading…</p></div>
</main>
<script src="/assets/vendor/pdf/pdf.min.js"></script>
<script src="/assets/vendor/pdf/pdf-lib.min.js"></script>
<script src="/contract-pdf.js?v=8"></script>
<script src="/sign.js?v=8"></script>
</body>
</html>
