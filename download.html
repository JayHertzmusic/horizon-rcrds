<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Download — HORIZON RCRDS</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon_icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --acc: #ff5500; --bg: #0a0a0b; --card: #141416; --line: rgba(255,255,255,.1); --text: #f4f4f5; --soft: #a1a1aa; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 400 16px/1.6 'Barlow', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  main { width: min(560px, 100%); margin: 0 auto; padding: 48px 16px 80px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .brand { display: inline-flex; align-items: center; gap: 12px; color: #fff; text-decoration: none; margin-bottom: 40px; }
  .brand img { height: 30px; }
  .brand span { font: 400 20px/1 'Bebas Neue', sans-serif; letter-spacing: .14em; margin-right: -.14em; }
  .cover { width: 220px; height: 220px; border-radius: 10px; object-fit: cover; box-shadow: 0 18px 50px rgba(0,0,0,.5); background: #000; }
  h1 { font: 400 clamp(30px, 7vw, 44px)/1 'Bebas Neue', sans-serif; margin: 26px 0 4px; }
  .artist { color: var(--soft); font-size: 15px; margin: 0 0 4px; }
  .card { width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 24px 22px; margin-top: 28px; }
  .notice { color: var(--soft); font-size: 14px; line-height: 1.6; text-align: left; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 100%; margin-top: 20px; padding: 15px 20px; border: 0; border-radius: 6px;
    font: 700 13px/1 'Barlow', sans-serif; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; text-decoration: none; }
  .btn.sc { background: #ff5500; color: #fff; }
  .btn.dl { background: #fff; color: #000; }
  .btn:disabled { opacity: .6; cursor: default; }
  .agree { display: flex; gap: 10px; align-items: flex-start; text-align: left; font-size: 13.5px; color: var(--soft); margin-top: 18px; cursor: pointer; }
  .agree input { margin-top: 3px; width: 17px; height: 17px; accent-color: var(--acc); flex: none; }
  .msg { color: var(--soft); font-size: 14px; }
  .err { color: #ff6b6b; font-size: 14px; margin-top: 14px; }
  .ok-badge { display: inline-flex; align-items: center; gap: 8px; color: #22c55e; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
  .foot { margin-top: 30px; font-size: 12px; color: #71717a; }
  .foot a { color: var(--soft); text-decoration: none; }
</style>
</head>
<body>
<main id="root"><p class="msg">Loading…</p></main>
<script>
(() => {
  const root = document.getElementById('root');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const id = (location.pathname.match(/^\/download\/([\w-]+)/) || [])[1] || '';
  const params = new URLSearchParams(location.search);
  const brand = '<a class="brand" href="/"><img src="/assets/logo.png" alt=""><span>HORIZON RCRDS</span></a>';
  const img = f => !f ? '' : /^(https?:|\/)/.test(f) ? f : '/assets/' + f;

  async function load() {
    if (!id) { root.innerHTML = brand + '<p class="msg">This download link is not valid.</p>'; return; }
    let d;
    try {
      const r = await fetch('/api/public/download/' + encodeURIComponent(id), { cache: 'no-store' });
      d = await r.json();
      if (!r.ok) throw new Error(d.message || 'This download is not available.');
    } catch (e) { root.innerHTML = brand + '<p class="msg">' + esc(e.message) + '</p>'; return; }

    const done = params.get('done') === '1';
    const error = params.get('error');
    const head = brand +
      (d.image ? '<img class="cover" src="' + esc(img(d.image)) + '" alt="">' : '') +
      '<h1>' + esc(d.title || 'Download') + '</h1>' +
      (d.artist ? '<p class="artist">' + esc(d.artist) + '</p>' : '');

    if (done) {
      root.innerHTML = head +
        '<div class="card"><span class="ok-badge">✓ Connected</span>' +
        '<p class="msg" style="margin:14px 0 0">Thanks for joining the chain! Your download is ready.</p>' +
        '<a class="btn dl" href="/api/public/download/' + encodeURIComponent(id) + '/file">Download</a></div>' +
        '<p class="foot"><a href="/">horizonrcrds.com</a></p>';
      return;
    }
    root.innerHTML = head +
      '<div class="card">' +
      '<p class="notice">' + esc(d.notice || '') + '</p>' +
      (error ? '<p class="err">' + esc(error) + '</p>' : '') +
      '<label class="agree"><input type="checkbox" id="agree"><span>I have read the above and I agree. Connect my SoundCloud and run these actions on my account.</span></label>' +
      '<button class="btn sc" id="go" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M1 15a1 1 0 0 0 2 0v-4a1 1 0 0 0-2 0zm3 1a1 1 0 0 0 2 0V9a1 1 0 0 0-2 0zm3 0a1 1 0 0 0 2 0V8a1 1 0 0 0-2 0zm3 0a1 1 0 0 0 2 0V7a1 1 0 0 0-2 0zm3 0a1 1 0 0 0 2 0V8a1 1 0 0 0-2 0z"/></svg>Connect with SoundCloud</button>' +
      '</div>' +
      '<p class="foot"><a href="/">horizonrcrds.com</a></p>';

    const chk = document.getElementById('agree'), go = document.getElementById('go');
    chk.addEventListener('change', () => { go.disabled = !chk.checked; });
    go.addEventListener('click', () => { if (chk.checked) location.href = '/api/sc/login?r=' + encodeURIComponent(id); });
  }
  load();
})();
</script>
</body>
</html>
