<body>
<div id="app" aria-live="polite"><p class="boot">Cargando…</p></div>
<div id="deploy" class="deploy" role="status" aria-live="polite" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<dialog id="confirm" class="confirm">
  <form method="dialog">
    <p id="confirm-msg"></p>
    <div class="confirm-actions">
      <button value="cancel" class="btn ghost">Cancelar</button>
      <button value="ok" id="confirm-ok" class="btn danger">Eliminar</button>
    </div>
  </form>
</dialog>
