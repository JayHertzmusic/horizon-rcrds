<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/png" href="./assets/favicon_icon.png" />
  <title>Full Catalogue — HORIZON RCRDS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;600;700&display=swap" rel="stylesheet"/>

  <style>
    :root {
      --accent-color:     #ffffff;
      --accent-color-rgb: 255, 255, 255;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      background: #0a0a0a;
      color: #e5e7eb;
      font-family: 'Barlow', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Grain */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.028; pointer-events: none; z-index: 9999;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #0a0a0a; }
    ::-webkit-scrollbar-thumb { background: var(--accent-color); border-radius: 2px; }

    /* ── HEADER ── */
    header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(10,10,10,0.92);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid #1a1a1a;
      padding: 14px 24px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px;
    }
    .back-link {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: 'Barlow', sans-serif; font-size: 0.68rem;
      font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase;
      color: #6b7280; text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--accent-color); }

    .header-brand {
      display: flex; flex-direction: column; align-items: center; line-height: 1;
    }
    .header-brand span:first-child {
      font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem;
      letter-spacing: 0.14em; color: #fff;
    }
    .header-brand span:last-child {
      font-family: 'Bebas Neue', sans-serif; font-size: 0.7rem;
      letter-spacing: 0.4em; color: var(--accent-color);
      transition: color 0.5s;
    }

    /* ── PAGE TITLE ── */
    .page-hero {
      padding: 56px 24px 40px;
      max-width: 1400px; margin: 0 auto;
      border-bottom: 1px solid #141414;
    }
    .page-label {
      font-size: 0.6rem; font-weight: 700; letter-spacing: 0.32em;
      text-transform: uppercase; color: var(--accent-color);
      display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
      transition: color 0.5s;
    }
    .page-label::before {
      content: ''; display: inline-block; width: 28px; height: 1px;
      background: var(--accent-color); transition: background 0.5s;
    }
    .page-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.8rem, 6vw, 5rem);
      letter-spacing: 0.04em; color: #fff; line-height: 1;
    }
    .page-count {
      font-size: 0.72rem; font-weight: 600; letter-spacing: 0.15em;
      text-transform: uppercase; color: #4b5563; margin-top: 8px;
    }

    /* ── VIEW TABS: Releases / Radio ── */
    .cat-tabs { display: flex; gap: 6px; margin-top: 22px; }
    .cat-tabs[hidden] { display: none; }
    .cat-tab {
      font-family: 'Barlow', sans-serif; font-size: 0.68rem; font-weight: 700;
      letter-spacing: 0.24em; text-transform: uppercase;
      padding: 9px 18px; border-radius: 3px; cursor: pointer;
      background: transparent; color: #6b7280; border: 1px solid #1f1f1f;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }
    .cat-tab:hover { color: #e5e7eb; border-color: #2a2a2a; }
    .cat-tab.is-on {
      color: var(--accent-color); border-color: rgba(var(--accent-color-rgb), 0.45);
      background: rgba(var(--accent-color-rgb), 0.08);
    }

    /* ── SEARCH / FILTER BAR ── */
    .filter-bar {
      max-width: 1400px; margin: 0 auto;
      padding: 20px 24px;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .search-wrap {
      flex: 1; min-width: 200px; max-width: 320px;
      position: relative;
    }
    .search-wrap i {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: #4b5563; font-size: 0.8rem; pointer-events: none;
    }
    .search-input {
      width: 100%; background: #111; border: 1px solid #1f1f1f;
      border-radius: 4px; padding: 8px 12px 8px 34px;
      font-family: 'Barlow', sans-serif; font-size: 0.78rem;
      color: #e5e7eb; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-input::placeholder { color: #4b5563; }
    .search-input:focus {
      border-color: rgba(var(--accent-color-rgb), 0.4);
      box-shadow: 0 0 0 2px rgba(var(--accent-color-rgb), 0.08);
    }

    .total-badge {
      font-family: 'Bebas Neue', sans-serif; font-size: 0.82rem;
      letter-spacing: 0.1em; color: var(--accent-color);
      background: rgba(var(--accent-color-rgb), 0.08);
      border: 1px solid rgba(var(--accent-color-rgb), 0.2);
      border-radius: 3px; padding: 2px 10px; white-space: nowrap;
      transition: color 0.5s, background 0.5s, border-color 0.5s;
    }

    /* ── COMPACT GRID ── */
    .catalogue-grid {
      max-width: 1400px; margin: 0 auto;
      padding: 4px 24px 64px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
    }
    @media (min-width: 640px)  { .catalogue-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; } }
    @media (min-width: 1024px) { .catalogue-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; } }

    /* ── COMPACT CARD ── */
    .cat-card {
      --track-color:     #ffffff;
      --track-color-rgb: 255, 255, 255;
      background: #111; border: 1px solid #1a1a1a;
      border-radius: 6px; overflow: hidden;
      display: flex; flex-direction: column;
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(.16,1,.3,1),
                  box-shadow 0.3s, border-color 0.3s;
    }
    .cat-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 36px rgba(0,0,0,0.7),
                  0 0 0 1px rgba(var(--track-color-rgb), 0.35),
                  0 0 20px -4px rgba(var(--track-color-rgb), 0.2);
      border-color: rgba(var(--track-color-rgb), 0.4);
    }

    /* Cover square */
    .cat-cover {
      width: 100%; aspect-ratio: 1/1;
      position: relative; overflow: hidden; background: #0d0d0d;
      flex-shrink: 0;
    }
    .cat-cover img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      opacity: 0; transition: transform 0.4s ease, opacity 0.35s;
    }
    .cat-card:hover .cat-cover img { transform: scale(1.05); }
    .cat-cover-fallback {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(1rem, 3vw, 1.4rem); letter-spacing: 0.06em;
      color: var(--track-color);
      background: linear-gradient(135deg, #141414, #0a0a0a);
      text-align: center; padding: 8px; line-height: 1.2;
    }

    /* Play overlay */
    .cat-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(var(--track-color-rgb),0.3) 0%, rgba(0,0,0,0.55) 50%, transparent 100%);
      opacity: 0; transition: opacity 0.3s;
      display: flex; align-items: center; justify-content: center;
    }
    .cat-card:hover .cat-overlay { opacity: 1; }
    .cat-overlay-icon {
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(0,0,0,0.6);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 0.75rem; border: 1px solid rgba(255,255,255,0.2);
    }

    /* Card info */
    .cat-info {
      padding: 10px 10px 8px;
      display: flex; align-items: flex-start; justify-content: space-between; gap: 6px;
    }
    .cat-title {
      font-family: 'Bebas Neue', sans-serif; font-size: 0.95rem;
      letter-spacing: 0.05em; color: #fff; line-height: 1.15;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .cat-artist {
      font-size: 0.6rem; font-weight: 600; letter-spacing: 0.12em;
      text-transform: uppercase; color: #6b7280; margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .cat-badge {
      font-family: 'Bebas Neue', sans-serif; font-size: 0.68rem;
      letter-spacing: 0.08em; color: var(--track-color);
      white-space: nowrap; flex-shrink: 0; margin-top: 2px;
      opacity: 0.8;
    }

    /* Icons row */
    .cat-icons {
      padding: 0 8px 10px;
      display: flex; align-items: center; gap: 2px;
      border-top: 1px solid #181818;
      padding-top: 8px;
    }
    .cat-icon {
      width: 32px; height: 32px; border-radius: 4px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 0.85rem; color: #4b5563; text-decoration: none;
      transition: color 0.2s, background 0.2s;
    }
    .cat-icon:hover             { color: var(--track-color); background: rgba(var(--track-color-rgb),0.1); }
    .cat-icon.spotify:hover     { color: #1db954; background: rgba(29,185,84,0.1); }
    .cat-icon.soundcloud:hover  { color: #ff5500; background: rgba(255,85,0,0.1); }

    /* No results */
    .no-results {
      grid-column: 1/-1; text-align: center;
      padding: 64px 0; color: #4b5563;
      font-size: 0.75rem; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase;
    }

    /* Skeleton */
    .skeleton {
      background: linear-gradient(90deg, #111 25%, #1a1a1a 50%, #111 75%);
      background-size: 200% 100%;
      animation: shimmer 1.6s infinite;
      border-radius: 6px;
    }
    @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

    /* Fade-in */
    .fade-in { animation: fadeIn 0.4s ease both; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  </style>
  <!-- Smooth scroll (Lenis, MIT: assets/vendor/LENIS-LICENSE.txt). Desktop mouse/trackpad only. -->
  <link rel="stylesheet" href="./assets/smooth-scroll.css?v=1"/>
  <script src="./assets/vendor/lenis.min.js?v=1.3.26" defer></script>
  <script src="./assets/smooth-scroll.js?v=1" defer></script>
</head>
<body>

<!-- HEADER -->
<header>
  <a href="./index.html" class="back-link">
    <i class="fa-solid fa-arrow-left"></i> Back to Home
  </a>

  <div class="header-brand">
    <span>HORIZON</span>
    <span>RCRDS</span>
  </div>

  <div style="width:80px;"></div><!-- balance spacer -->
</header>

<!-- PAGE HERO -->
<div class="page-hero">
  <div class="page-label">Discography</div>
  <h1 class="page-title">FULL CATALOGUE</h1>
  <p id="release-count" class="page-count">Loading releases…</p>
  <div id="cat-tabs" class="cat-tabs" role="tablist" aria-label="Catalogue" hidden>
    <button type="button" class="cat-tab is-on" role="tab" aria-selected="true" data-view="releases">Releases</button>
    <button type="button" class="cat-tab" role="tab" aria-selected="false" data-view="radio">Radio</button>
  </div>
</div>

<!-- FILTER BAR -->
<div class="filter-bar">
  <div class="search-wrap">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input id="search-input" class="search-input" type="text"
           placeholder="Search title or artist…" autocomplete="off" />
  </div>
  <span id="count-badge" class="total-badge" style="display:none;"></span>
</div>

<!-- CATALOGUE GRID -->
<div id="catalogue-grid" class="catalogue-grid">
  <!-- 12 skeleton placeholders while loading -->
  <div class="skeleton" style="aspect-ratio:3/4;"></div>
  <div class="skeleton" style="aspect-ratio:3/4;"></div>
  <div class="skeleton" style="aspect-ratio:3/4;"></div>
  <div class="skeleton" style="aspect-ratio:3/4;"></div>
  <div class="skeleton" style="aspect-ratio:3/4;"></div>
  <div class="skeleton" style="aspect-ratio:3/4;"></div>
  <div class="skeleton" style="aspect-ratio:3/4;"></div>
  <div class="skeleton" style="aspect-ratio:3/4;"></div>
  <div class="skeleton" style="aspect-ratio:3/4;"></div>
  <div class="skeleton" style="aspect-ratio:3/4;"></div>
  <div class="skeleton" style="aspect-ratio:3/4;"></div>
  <div class="skeleton" style="aspect-ratio:3/4;"></div>
</div>

<script>
/* ── Color utilities ─────────────────────────── */
function hexToRgb(hex) {
  hex = hex.trim().replace(/^#/, '');
  if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
  const n = parseInt(hex, 16);
  return isNaN(n) ? null : { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}
function rgbStr(hex) {
  const c = hexToRgb(hex);
  return c ? `${c.r}, ${c.g}, ${c.b}` : '255, 255, 255';
}
function safeColor(color) {
  return (color && /^#[0-9a-fA-F]{3,6}$/.test(color.trim())) ? color.trim() : '#ffffff';
}

/* ── Apply accent from releases[0].color ─────── */
function applyAccent(color) {
  const safe = safeColor(color);
  document.documentElement.style.setProperty('--accent-color',     safe);
  document.documentElement.style.setProperty('--accent-color-rgb', rgbStr(safe));
}

/* ── Image path helper ───────────────────────── */
function imgPath(f) {
  if (!f) return '';
  if (f.startsWith('http') || f.startsWith('./') || f.startsWith('/')) return f;
  return './assets/' + f;
}

/* ── Build compact card ──────────────────────── */
function buildCatCard(r, idx) {
  const card  = document.createElement('div');
  card.className = 'cat-card fade-in';
  card.style.animationDelay = (idx % 24 * 0.03) + 's';

  const color    = safeColor(r.color);
  const colorRgb = rgbStr(color);
  card.style.setProperty('--track-color',     color);
  card.style.setProperty('--track-color-rgb', colorRgb);

  const imgSrc   = imgPath(r.image);
  const title    = (r.title  || 'Untitled').replace(/</g, '&lt;');
  const artist   = (r.artist || '').replace(/</g, '&lt;');
  const cat      = r.catalog_number || r.catalog || '';

  const iconStream     = r.stream_link
    ? `<a href="${r.stream_link.replace(/"/g,'&quot;')}" target="_blank" rel="noopener noreferrer"
          class="cat-icon" title="Stream" aria-label="Stream">
         <i class="fa-solid fa-arrow-up-right-from-square"></i>
       </a>` : '';
  const iconSpotify    = r.spotify_link
    ? `<a href="${r.spotify_link.replace(/"/g,'&quot;')}" target="_blank" rel="noopener noreferrer"
          class="cat-icon spotify" title="Spotify" aria-label="Spotify">
         <i class="fa-brands fa-spotify"></i>
       </a>` : '';
  const iconSoundcloud = r.soundcloud_link
    ? `<a href="${r.soundcloud_link.replace(/"/g,'&quot;')}" target="_blank" rel="noopener noreferrer"
          class="cat-icon soundcloud" title="SoundCloud" aria-label="SoundCloud">
         <i class="fa-brands fa-soundcloud"></i>
       </a>` : '';

  const hasIcons = iconStream || iconSpotify || iconSoundcloud;

  card.innerHTML = `
    <div class="cat-cover">
      <div class="cat-cover-fallback">${artist || title}</div>
      ${imgSrc ? `<img src="${imgSrc}" alt="${title} cover" loading="lazy" />` : ''}
      <div class="cat-overlay">
        <div class="cat-overlay-icon"><i class="fa-solid fa-play" style="margin-left:2px;"></i></div>
      </div>
    </div>
    <div class="cat-info">
      <div style="min-width:0;">
        <div class="cat-title">${title}</div>
        <div class="cat-artist">${artist}</div>
      </div>
      ${cat ? `<span class="cat-badge">${cat}</span>` : ''}
    </div>
    ${hasIcons ? `<div class="cat-icons">${iconStream}${iconSpotify}${iconSoundcloud}</div>` : ''}
  `;

  /* Image load/error */
  const img = card.querySelector('img');
  if (img) {
    const fb = card.querySelector('.cat-cover-fallback');
    img.onload  = () => { img.style.opacity = '1'; if (fb) fb.style.display = 'none'; };
    img.onerror = () => { img.style.display = 'none'; if (fb) fb.style.display = 'flex'; };
  }

  /* Click card → stream link (mixtapes: SoundCloud) */
  const openUrl = r.stream_link || r.open_link;
  if (openUrl) {
    card.addEventListener('click', (e) => {
      if (e.target.closest('a')) return;
      window.open(openUrl, '_blank', 'noopener,noreferrer');
    });
  }

  return card;
}

/* ── Render filtered list ────────────────────── */
let allReleases = [];
let allMixtapes = [];   /* mixtapes.json, mapped to the same card shape */
let view = location.hash === '#radio' ? 'radio' : 'releases';
const noun = n => view === 'radio' ? `mixtape${n !== 1 ? 's' : ''}` : `release${n !== 1 ? 's' : ''}`;
const currentList = () => view === 'radio' ? allMixtapes : allReleases;

function renderGrid(list) {
  const grid  = document.getElementById('catalogue-grid');
  const badge = document.getElementById('count-badge');
  grid.innerHTML = '';

  if (!list.length) {
    grid.innerHTML = `<div class="no-results">No ${noun(0)} found</div>`;
    if (badge) { badge.textContent = `0 ${noun(0)}`; badge.style.display = 'inline'; }
    return;
  }

  list.forEach((r, i) => grid.appendChild(buildCatCard(r, i)));
  if (badge) {
    badge.textContent  = `${list.length} ${noun(list.length)}`;
    badge.style.display = 'inline';
  }
}

/* ── Search filter ───────────────────────────── */
function filterReleases(query) {
  const q = query.toLowerCase().trim();
  if (!q) return currentList();
  return currentList().filter(r =>
    (r.title  || '').toLowerCase().includes(q) ||
    (r.artist || '').toLowerCase().includes(q) ||
    (r.catalog_number || r.catalog || '').toLowerCase().includes(q)
  );
}

document.getElementById('search-input').addEventListener('input', (e) => {
  renderGrid(filterReleases(e.target.value));
});

/* ── Fetch & boot ────────────────────────────── */
async function loadCatalogue() {
  try {
    const res  = await fetch('./releases.json');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    if (!Array.isArray(data) || !data.length) throw new Error('Empty');

    allReleases = data;

    /* Apply accent from latest release */
    if (data[0] && data[0].color) applyAccent(data[0].color);

    /* Radio mixtapes (optional: without mixtapes.json there are no tabs) */
    try {
      const mres = await fetch('./mixtapes.json');
      const mix = mres.ok ? await mres.json() : [];
      if (Array.isArray(mix) && mix.length) {
        allMixtapes = mix.map(m => ({
          title: m.number ? `Horizon Mixtape ${m.number}` : (m.title || 'Horizon Mixtape'),
          artist: m.artist || '',
          catalog: 'Radio',
          image: m.image,
          color: m.color,
          soundcloud_link: m.soundcloud_link,
          open_link: m.soundcloud_link,
        }));
        document.getElementById('cat-tabs').hidden = false;
      }
    } catch (e) { /* no radio yet */ }
    if (!allMixtapes.length) view = 'releases';

    showView(view);

  } catch (err) {
    console.error('[HORIZON RCRDS] catalogue fetch failed:', err);
    document.getElementById('catalogue-grid').innerHTML =
      '<div class="no-results">Could not load releases — check the console.</div>';
  }
}

/* ── Releases / Radio tabs ───────────────────── */
function showView(v) {
  view = v === 'radio' && allMixtapes.length ? 'radio' : 'releases';
  document.querySelectorAll('.cat-tab').forEach(t => {
    const on = t.dataset.view === view;
    t.classList.toggle('is-on', on);
    t.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  const list = currentList();
  const countEl = document.getElementById('release-count');
  if (countEl) countEl.textContent = `${list.length} ${noun(list.length)} in the catalogue`;
  const input = document.getElementById('search-input');
  input.placeholder = view === 'radio' ? 'Search mixtape or guest…' : 'Search title or artist…';
  renderGrid(filterReleases(input.value));
}
document.getElementById('cat-tabs').addEventListener('click', e => {
  const t = e.target.closest('.cat-tab');
  if (!t) return;
  history.replaceState(null, '', t.dataset.view === 'radio' ? '#radio' : location.pathname);
  showView(t.dataset.view);
});
window.addEventListener('hashchange', () => showView(location.hash === '#radio' ? 'radio' : 'releases'));

loadCatalogue();
</script>
</body>
</html>
