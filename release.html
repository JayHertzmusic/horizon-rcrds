<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    /* start downloading the release data straight away, in parallel with the styles */
    window.HZ_RELEASES = fetch('./releases.json', { cache: 'no-cache' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
    window.HZ_RELEASES.catch(function () {});
  </script>
  <title>HORIZON RCRDS</title>
  <meta name="description" content="Listen on Spotify, SoundCloud and every platform. Released by HORIZON RCRDS." />
  <link rel="icon" type="image/png" href="./assets/favicon_icon.png" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" media="print" onload="this.media='all'"/><noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/></noscript>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:ital,wght@0,300;0,400;0,600;0,700;1,300&display=swap" rel="stylesheet"/>

  <style>
    /* Same tokens and pieces as index.html: the page takes the colour of its release. */
    :root { --accent-color: #ffffff; --accent-color-rgb: 255, 255, 255; --card-ink: #000; }
    html { scroll-behavior: smooth; }
    *, *::before, *::after { box-sizing: border-box; }
    body { background-color: #0a0a0a; color: #e5e7eb; font-family: 'Barlow', sans-serif; overflow-x: hidden; margin: 0; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 9999; opacity: 0.028; background-size: 180px 180px;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #0a0a0a; }
    ::-webkit-scrollbar-thumb { background: var(--accent-color); border-radius: 2px; }
    :focus-visible { outline: 2px solid var(--accent-color); outline-offset: 4px; }

    /* ── NAVBAR (as on the home page) ── */
    #navbar { transition: background 0.4s; }
    #navbar.scrolled { background: rgba(10,10,10,0.96); border-bottom: 1px solid #1f1f1f; }
    .nav-link { position: relative; font-weight: 600; font-size: 0.7rem; letter-spacing: 0.25em; text-transform: uppercase; color: #9ca3af; transition: color 0.25s; text-decoration: none; }
    .nav-link::after { content: ''; position: absolute; bottom: -3px; left: 0; right: 100%; height: 1px; background: var(--accent-color); transition: right 0.3s ease; }
    .nav-link:hover { color: #e5e7eb; }
    .nav-link:hover::after { right: 0; }
    .accent-line { background: var(--accent-color); }
    #nav-menu { transition: max-height 0.4s ease, opacity 0.4s; max-height: 0; overflow: hidden; opacity: 0; }

    /* ── RELEASE HERO ── */
    .rel-bg {
      background:
        radial-gradient(ellipse 70% 55% at 30% 45%, rgba(var(--accent-color-rgb), 0.10) 0%, transparent 70%),
        radial-gradient(ellipse 40% 30% at 85% 85%, rgba(var(--accent-color-rgb), 0.05) 0%, transparent 60%),
        #0a0a0a;
      min-height: 100vh; min-height: 100svh;
    }
    .rel-grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr); gap: clamp(36px, 5vw, 84px); align-items: center; }
    @media (max-width: 1023px) { .rel-grid { grid-template-columns: minmax(0, 1fr); gap: 40px; } }

    .back-link { display: inline-flex; align-items: center; gap: 10px; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.28em; text-transform: uppercase; color: #6b7280; text-decoration: none; transition: color 0.2s; margin-bottom: 28px; }
    .back-link:hover { color: var(--accent-color); }

    /* cover floating in 3D, same as the home stage */
    .stage { position: relative; perspective: 1400px; }
    .stage-tilt { position: relative; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(.16,1,.3,1); pointer-events: none; }
    .stage-tilt .stage-cover { pointer-events: auto; }
    .stage-cover {
      position: relative; width: 100%; max-width: clamp(300px, calc((100vh - 220px) * 0.8), 530px); aspect-ratio: 1 / 1; margin: 0 auto;
      border-radius: 14px; overflow: hidden; background: #0d0d0d;
      transform: rotateY(9deg) rotateX(4deg);
      box-shadow: 0 40px 90px rgba(0,0,0,0.75), 0 0 0 1px rgba(255,255,255,0.05), 0 0 90px -18px rgba(var(--accent-color-rgb), 0.7);
      animation: stage-float 7s ease-in-out infinite;
    }
    .stage-cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.6s; }
    .stage-cover::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(245deg, rgba(255,255,255,0.14) 0%, transparent 32%, transparent 70%, rgba(var(--accent-color-rgb), 0.18) 100%); }
    .stage-glow { position: absolute; inset: 8% 14% -6% 4%; border-radius: 50%; pointer-events: none; z-index: -1; background: radial-gradient(closest-side, rgba(var(--accent-color-rgb), 0.35), transparent); filter: blur(30px); }
    @keyframes stage-float { 0%, 100% { transform: rotateY(9deg) rotateX(4deg) translateY(0); } 50% { transform: rotateY(7deg) rotateX(2deg) translateY(-12px); } }
    @media (max-width: 1023px) { .stage-cover { max-width: min(420px, 100%); } }
    @media (prefers-reduced-motion: reduce) { .stage-cover { animation: none; } }

    /* Hover on the cover: it takes the release colour, glows harder and shows play */
    .stage-cover { cursor: pointer; transition: box-shadow 0.45s ease; }
    .stage-cover img { transition: opacity 0.6s, transform 0.7s cubic-bezier(.16,1,.3,1), filter 0.45s; }
    .cover-tint {
      position: absolute; inset: 0; z-index: 1; pointer-events: none; opacity: 0; transition: opacity 0.45s ease;
      background:
        linear-gradient(to top, rgba(var(--accent-color-rgb), 0.22) 0%, transparent 45%), rgba(0,0,0,0.12);
      mix-blend-mode: normal;
    }
    .cover-tint::before { content: ''; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(var(--accent-color-rgb), 0.7); }
    .cover-play {
      position: absolute; left: 50%; top: 50%; z-index: 2; width: 84px; height: 84px; border-radius: 50%; border: 0; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      background: var(--accent-color); color: var(--card-ink); font-size: 1.5rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.45);
      opacity: 0; transform: translate(-50%, -50%) scale(0.8); transition: opacity 0.35s ease, transform 0.45s cubic-bezier(.16,1,.3,1);
    }
    .cover-play i { margin-left: 4px; }
    .cover-play.is-playing i, .cover-play.is-loading i { margin-left: 0; }
    .stage-cover:hover, .stage-cover:focus-within { box-shadow: 0 44px 100px rgba(0,0,0,0.78), 0 0 0 1px rgba(var(--accent-color-rgb), 0.35), 0 0 100px -16px rgba(var(--accent-color-rgb), 0.75); }
    /* no zoom on hover: the cover already tilts with the mouse */
    .stage-cover:hover .cover-tint, .stage-cover:focus-within .cover-tint { opacity: 1; }
    .stage-cover:hover .cover-play, .stage-cover:focus-within .cover-play { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    .stage-glow { transition: opacity 0.45s; opacity: 0.6; }
    .stage:hover .stage-glow { opacity: 0.8; }
    /* touch screens: the play button is always there, small, in the corner */
    @media (hover: none) {
      .cover-play { opacity: 1; width: 60px; height: 60px; font-size: 1.1rem; left: auto; top: auto; right: 16px; bottom: 16px; transform: none; }
      .stage-cover:hover .cover-play { transform: none; }
    }

    /* ── ANIMATED BACKGROUND: the cover, blurred, drifting + lights in the release colour + floating particles ── */
    .rel-bg { position: relative; overflow: hidden; isolation: isolate; }
    .is-off, .is-off *, .is-off *::before, .is-off *::after { animation-play-state: paused !important; }
    .bg-anim { position: absolute; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
    .bg-cover {
      position: absolute; inset: -20%; background-size: cover; background-position: center;
      filter: blur(60px) saturate(1.6); will-change: opacity; opacity: 0; transition: opacity 1.4s ease;
    }
    .bg-cover.on { opacity: 0.2; }
    .bg-blob { position: absolute; border-radius: 50%; will-change: transform; background: radial-gradient(closest-side, rgba(var(--accent-color-rgb), 0.55), transparent); transition: opacity 0.8s; }
    .bg-blob.b1 { width: 52vmax; height: 52vmax; left: -14vmax; top: -10vmax; opacity: 0.32; animation: blob1 22s ease-in-out infinite alternate; }
    .bg-blob.b2 { width: 40vmax; height: 40vmax; right: -12vmax; bottom: -16vmax; opacity: 0.22; animation: blob2 27s ease-in-out infinite alternate; }
    .bg-grid {
      position: absolute; inset: -48px 0 0 -48px; will-change: transform;
      background-image: linear-gradient(rgba(var(--accent-color-rgb), 0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(var(--accent-color-rgb), 0.06) 1px, transparent 1px);
      background-size: 48px 48px;
      -webkit-mask-image: radial-gradient(ellipse 70% 60% at 30% 50%, #000 0%, transparent 75%); mask-image: radial-gradient(ellipse 70% 60% at 30% 50%, #000 0%, transparent 75%);
      animation: grid-shift 40s linear infinite;
    }
    @keyframes grid-shift { to { transform: translate(48px, 48px); } }
    #bg-particles { position: absolute; inset: 0; width: 100%; height: 100%; }
    .bg-anim::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,10,10,0.35) 0%, transparent 25%, transparent 70%, #0a0a0a 100%); }
    @keyframes bg-drift { from { transform: translate(-4%, -3%) scale(1) rotate(0deg); } to { transform: translate(4%, 3%) scale(1.12) rotate(6deg); } }
    @keyframes blob1 { from { transform: translate(0, 0) scale(1); } to { transform: translate(18vw, 12vh) scale(1.15); } }
    @keyframes blob2 { from { transform: translate(0, 0) scale(1.1); } to { transform: translate(-16vw, -14vh) scale(0.9); } }
    @keyframes grid-move { to { background-position: 48px 48px; } }
    /* while the track plays the background wakes up */
    body.is-playing .bg-blob.b1 { opacity: 0.5; animation-duration: 9s; }
    body.is-playing .bg-blob.b2 { opacity: 0.38; animation-duration: 11s; }
    body.is-playing .bg-cover.on { opacity: 0.3; }
    @media (prefers-reduced-motion: reduce) { .bg-cover, .bg-blob, .bg-grid { animation: none !important; } }

    .label-tag { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.3em; text-transform: uppercase; color: var(--accent-color); }
    .pulse-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-color); box-shadow: 0 0 8px rgba(var(--accent-color-rgb), 0.7); animation: pulse-dot 2s ease-in-out infinite; display: inline-block; flex-shrink: 0; }
    @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .hero-title {
      font-family: 'Bebas Neue', sans-serif; font-size: clamp(2.7rem, 5.6vw, 6.4rem); line-height: 0.9; letter-spacing: 0.005em; margin: 0;
      background: linear-gradient(160deg, #ffffff 0%, #a0b4cc 55%, var(--accent-color) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; overflow-wrap: anywhere;
    }
    .hr-artist { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: #9ca3af; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 14px 0 0; }
    .num-badge { font-family: 'Bebas Neue', sans-serif; font-size: 0.82rem; letter-spacing: 0.1em; color: var(--track-color, var(--accent-color)); background: rgba(var(--track-color-rgb, var(--accent-color-rgb)), 0.1); border: 1px solid rgba(var(--track-color-rgb, var(--accent-color-rgb)), 0.25); border-radius: 2px; padding: 3px 7px 0; white-space: nowrap; }

    /* ── PLAYER (same look as the home hero player; plays the full track from SoundCloud) ── */
    .hc-player { display: flex; align-items: center; gap: 16px; margin-top: 30px; max-width: 32rem; }
    .hc-play {
      flex: none; width: 56px; height: 56px; border-radius: 50%; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      background: var(--accent-color); color: var(--card-ink);
      box-shadow: 0 0 22px rgba(var(--accent-color-rgb), 0.45); transition: transform 0.2s, box-shadow 0.3s;
    }
    .hc-play:hover { transform: scale(1.08); box-shadow: 0 0 34px rgba(var(--accent-color-rgb), 0.7); }
    .hc-play i { font-size: 0.9rem; margin-left: 2px; }
    .hc-play.is-playing i, .hc-play.is-loading i { margin-left: 0; }
    .hc-track { flex: 1; min-width: 0; }
    .waveform { display: flex; align-items: center; justify-content: space-between; gap: 3px; height: 30px; margin-bottom: 8px; overflow: hidden; cursor: pointer; }
    .waveform span { display: block; width: 3px; border-radius: 2px; background: var(--accent-color); opacity: 0.28; transition: opacity 0.15s; }
    .waveform span.on { opacity: 1; box-shadow: 0 0 6px rgba(var(--accent-color-rgb), 0.45); }
    .waveform.is-playing span { animation: wave-breathe 1.1s ease-in-out infinite alternate; animation-delay: calc(var(--i, 0) * -0.07s); }
    @keyframes wave-breathe { from { transform: scaleY(0.6); } to { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) { .waveform.is-playing span { animation: none; } }
    .progress-track { height: 2px; background: #1f1f1f; border-radius: 1px; margin-bottom: 6px; position: relative; cursor: pointer; }
    .progress-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent-color), rgba(var(--accent-color-rgb), 0.5)); border-radius: 1px; position: relative; }
    .progress-fill::after { content: ''; position: absolute; right: -4px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent-color); box-shadow: 0 0 8px rgba(var(--accent-color-rgb), 0.8); }
    .hc-times { display: flex; justify-content: space-between; font-size: 0.62rem; font-weight: 600; letter-spacing: 0.1em; color: #6b7280; }

    /* ── LISTEN ON ── */
    .listen-label { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.32em; text-transform: uppercase; color: #6b7280; margin: 40px 0 14px; display: flex; align-items: center; gap: 12px; }
    .listen-label::after { content: ''; flex: 1; height: 1px; background: #1f1f1f; }
    .platforms { display: grid; gap: 10px; max-width: 32rem; }
    .platform {
      --pc: var(--accent-color); --pc-rgb: var(--accent-color-rgb);
      display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 14px;
      padding: 10px 12px 10px 10px; border-radius: 8px; background: #111; border: 1px solid #1e1e1e; text-decoration: none;
      transition: transform 0.35s cubic-bezier(.16,1,.3,1), border-color 0.3s, box-shadow 0.3s, background 0.3s;
    }
    .platform .ico { width: 44px; height: 44px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; color: var(--pc); background: rgba(var(--pc-rgb), 0.1); border: 1px solid rgba(var(--pc-rgb), 0.25); }
    .platform .name { font-family: 'Bebas Neue', sans-serif; font-size: 1.35rem; letter-spacing: 0.03em; color: #fff; line-height: 1; }
    .platform .sub { display: block; font-family: 'Barlow', sans-serif; font-size: 0.6rem; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: #6b7280; margin-top: 4px; }
    .platform .go { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: #9ca3af; display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 3px; border: 1px solid #262626; transition: color 0.25s, border-color 0.25s, background 0.25s; }
    .platform:hover { transform: translateX(4px); border-color: rgba(var(--pc-rgb), 0.5); box-shadow: 0 14px 40px rgba(0,0,0,0.6), 0 0 26px -6px rgba(var(--pc-rgb), 0.35); background: #131313; }
    .platform:hover .go { color: var(--card-ink-p, #000); background: var(--pc); border-color: var(--pc); }
    .platform.main { background: rgba(var(--accent-color-rgb), 0.08); border-color: rgba(var(--accent-color-rgb), 0.35); }
    .platform.main .go { color: var(--card-ink); background: var(--accent-color); border-color: var(--accent-color); }
    .share-row { display: flex; gap: 10px; margin-top: 18px; max-width: 32rem; }
    .btn-outline { display: inline-flex; align-items: center; gap: 10px; background: transparent; color: var(--accent-color); font-weight: 700; font-size: 0.65rem; letter-spacing: 0.25em; text-transform: uppercase; padding: 12px 22px; border-radius: 3px; border: 1px solid rgba(var(--accent-color-rgb), 0.5); cursor: pointer; text-decoration: none; transition: background 0.25s, box-shadow 0.25s, transform 0.2s; }
    .btn-outline:hover { background: rgba(var(--accent-color-rgb), 0.1); box-shadow: 0 0 20px rgba(var(--accent-color-rgb), 0.3); transform: translateY(-1px); }

    /* ── MORE RELEASES (same cards as the home page) ── */
    .h-px-elec { height: 1px; background: linear-gradient(90deg, transparent, var(--accent-color) 40%, rgba(var(--accent-color-rgb),0.5) 70%, transparent); }
    .section-label { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.32em; text-transform: uppercase; color: var(--accent-color); }
    .section-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(2.5rem, 6vw, 4.2rem); letter-spacing: 0.012em; color: #fff; line-height: 1; margin: 0; }
    .release-card { --track-color: #fff; --track-color-rgb: 255, 255, 255; background: #111; border: 1px solid #1e1e1e; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; text-decoration: none; transition: transform 0.38s cubic-bezier(.16,1,.3,1), box-shadow 0.38s ease, border-color 0.38s ease; }
    .release-card:hover { transform: translateY(-6px); box-shadow: 0 20px 56px rgba(0,0,0,0.75), 0 0 0 1px rgba(var(--track-color-rgb), 0.45), 0 0 28px -4px rgba(var(--track-color-rgb), 0.3); border-color: rgba(var(--track-color-rgb), 0.5); }
    .card-cover { width: 100%; aspect-ratio: 1/1; position: relative; overflow: hidden; background: #0d0d0d; }
    .card-cover img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.5s ease; }
    .release-card:hover .card-cover img { transform: scale(1.07); }
    .card-body { padding: 14px 14px 16px; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .card-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.05rem; letter-spacing: 0.03em; color: #fff; line-height: 1.2; }
    .card-artist { font-size: 0.68rem; font-weight: 600; letter-spacing: 0.14em; color: #6b7280; text-transform: uppercase; margin-top: 4px; }
    .card-tag { font-size: 0.58rem; font-weight: 700; letter-spacing: 0.28em; text-transform: uppercase; color: var(--track-color); margin-bottom: 8px; }

    .social-icon { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid #1f1f1f; border-radius: 50%; color: #6b7280; font-size: 1rem; text-decoration: none; transition: color 0.25s, border-color 0.25s, box-shadow 0.25s, transform 0.2s; }
    .social-icon:hover { color: var(--accent-color); border-color: var(--accent-color); box-shadow: 0 0 16px rgba(var(--accent-color-rgb), 0.35); transform: translateY(-2px); }

    /* the top of the page appears on load; the rest when it scrolls into view */
    .intro { animation: intro-rise 0.35s ease-out both; }
    #cover { transition: opacity 0.25s ease, transform 0.7s cubic-bezier(.16,1,.3,1); }
    @keyframes intro-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .intro { animation: none; } }
    .reveal { opacity: 0; transform: translateY(28px); transition: opacity 0.7s ease, transform 0.7s ease; }
    .reveal.visible { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) { .reveal { opacity: 1; transform: none; } }
    .skeleton { background: linear-gradient(90deg, #111 25%, #1a1a1a 50%, #111 75%); background-size: 200% 100%; animation: shimmer 1.6s infinite; border-radius: 4px; }
    @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
    .toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 16px); opacity: 0; pointer-events: none; z-index: 60; background: #111; border: 1px solid rgba(var(--accent-color-rgb), 0.5); color: #fff; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; padding: 12px 20px; border-radius: 3px; transition: opacity 0.3s, transform 0.3s; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* ═════════ ONE SCREEN ═════════ */
    /* the back link always stays above the floating cover */
    .back-link { position: relative; z-index: 3; }
    /* Share sits on the "Listen on" line (saves a row) */
    .listen-label .share-btn { order: 2; display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 3px; border: 1px solid rgba(var(--accent-color-rgb), 0.5); color: var(--accent-color); font-size: 0.6rem; font-weight: 700; letter-spacing: 0.25em; text-transform: uppercase; background: transparent; cursor: pointer; transition: background 0.25s, box-shadow 0.25s; }
    .listen-label .share-btn:hover { background: rgba(var(--accent-color-rgb), 0.1); box-shadow: 0 0 16px rgba(var(--accent-color-rgb), 0.3); }
    .listen-label::after { order: 1; }
    .listen-label { max-width: 32rem; }
    /* footer: below everything on phones, a thin bar inside the screen on desktop */
    .rel-foot { margin-top: 56px; padding: 28px 0 8px; border-top: 1px solid #1f1f1f; }
    @media (min-width: 1024px) and (min-height: 560px) {
      /* desktop: the whole release fits in the window, no scrolling */
      .rel-bg { min-height: 100vh; min-height: 100svh; padding-top: 86px !important; padding-bottom: 62px !important; }

/* ── helpers (same as index.html) ── */
function hexToRgb(hex) {
  hex = String(hex || '').trim().replace(/^#/, '');
  if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
  const n = parseInt(hex, 16);
  return isNaN(n) ? null : { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}
function rgbStr(hex) { const c = hexToRgb(hex); return c ? `${c.r}, ${c.g}, ${c.b}` : '255, 255, 255'; }
function safeColor(c) { return (c && /^#[0-9a-fA-F]{3,6}$/.test(String(c).trim())) ? String(c).trim() : '#ffffff'; }
function inkFor(hex) { const c = hexToRgb(hex) || { r: 255, g: 255, b: 255 }; return (0.299 * c.r + 0.587 * c.g + 0.114 * c.b) > 150 ? '#000' : '#fff'; }
function escHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch])); }
function imgPath(f) { if (!f) return ''; if (/^(https?:|\.\/|\/)/.test(f)) return f; return './assets/' + f; }
function fmtTime(sec) { if (!isFinite(sec) || sec < 0) return '0:00'; return `${Math.floor(sec / 60)}:${String(Math.floor(sec % 60)).padStart(2, '0')}`; }
/* Where the visitor came from (set by the links on the home page and the catalogue): home | catalogue */
const FROM = (p => p === 'home' || p === 'catalogue' ? p : '')(new URLSearchParams(location.search).get('from'));
/* links to other releases keep that origin, so "back" still leads to the same place */
const releaseHref = r => r.id ? `./release?id=${encodeURIComponent(r.id)}${FROM ? '&from=' + FROM : ''}` : (r.stream_link || '#');

/* Back link: "Back to home" from the home page, "Back to catalogue" from the catalogue, "Home" otherwise
   (e.g. a shared link). Coming straight from that page, it goes back in history so the page opens where it was left. */
(() => {
  const back = document.getElementById('back');
  const target = FROM === 'catalogue' ? { href: './catalogue', label: 'Back to catalogue', page: /catalogue(\.html)?$/ }
               : FROM === 'home' ? { href: './#releases', label: 'Back to home', page: /(^|\/)(index\.html)?$/ }
               : { href: './', label: 'Home', page: null };
  back.href = target.href;
  back.querySelector('span').textContent = target.label;
  back.addEventListener('click', e => {
    let ref = null;
    try { ref = document.referrer ? new URL(document.referrer) : null; } catch (err) {}

})();

/* ── SoundCloud player behind the waveform: plays the full track inside the page ── */
function scPlayer(url, ui) {
  let widget = null, ready = null, duration = 0, state = 'idle';
  const buttons = [ui.play, ...(ui.extra || [])];
  const set = s => {
    state = s;
    buttons.forEach(b => {
      b.querySelector('i').className = s === 'loading' ? 'fa-solid fa-circle-notch fa-spin' : s === 'play' ? 'fa-solid fa-pause' : 'fa-solid fa-play';
      b.classList.toggle('is-playing', s === 'play');
      b.classList.toggle('is-loading', s === 'loading');
      b.setAttribute('aria-label', s === 'play' ? 'Pause' : 'Play');
    });
    ui.wave.classList.toggle('is-playing', s === 'play');
    document.body.classList.toggle('is-playing', s === 'play');
  };
  const draw = rel => {
    ui.fill.style.width = (rel * 100) + '%';
    ui.seek.setAttribute('aria-valuenow', Math.round(rel * 100));
    const bars = ui.wave.children, upto = Math.round(rel * bars.length);
    for (let i = 0; i < bars.length; i++) bars[i].classList.toggle('on', i < upto);
  };
  let frame = null, shown = false;
  /* Plan B (mostly iPhone): if the hidden player was not allowed to start, show the real SoundCloud
     player under ours so the visitor can press play inside it. */
  function showFrame() {
    if (!frame || shown) return;
    shown = true;
    frame.style.cssText = 'display:block;width:100%;max-width:32rem;height:120px;border:0;border-radius:8px;margin-top:14px;';
    ui.box.insertAdjacentElement('afterend', frame);
  }
  function load() {
    if (ready) return ready;
    return ready = new Promise((ok, ko) => {
      const go = () => {
        const f = frame = document.createElement('iframe');
        f.allow = 'autoplay'; f.title = 'SoundCloud player';
        f.style.cssText = 'position:fixed;width:1px;height:1px;left:-10px;bottom:-10px;opacity:0;pointer-events:none;border:0';
        f.src = `https://w.soundcloud.com/player/?url=${encodeURIComponent(url)}&auto_play=false&visual=false`;
        document.body.appendChild(f);
        widget = SC.Widget(f);
        widget.bind(SC.Widget.Events.READY, () => { widget.getDuration(d => { duration = d / 1000; ui.dur.textContent = fmtTime(duration); }); ok(); });
        widget.bind(SC.Widget.Events.PLAY, () => set('play'));
        widget.bind(SC.Widget.Events.PAUSE, () => set('pause'));
        widget.bind(SC.Widget.Events.FINISH, () => { set('pause'); draw(0); ui.cur.textContent = '0:00'; });
        widget.bind(SC.Widget.Events.PLAY_PROGRESS, e => { draw(e.relativePosition); ui.cur.textContent = fmtTime(e.currentPosition / 1000); });
      };
      if (window.SC && SC.Widget) return go();
      const s = document.createElement('script');
      s.src = 'https://w.soundcloud.com/player/api.js'; s.onload = go; s.onerror = ko;
      document.head.appendChild(s);
    });
  }
  const toggle = async () => {
    if (state === 'play') { widget.pause(); return; }
    if (state === 'loading') return;
    set('loading');
    try {
      await load(); widget.play();
      setTimeout(() => { if (state === 'loading') { set('idle'); showFrame(); } }, 3500);
    }
    catch { set('idle'); window.open(url, '_blank', 'noopener,noreferrer'); }
  };
  buttons.forEach(b => b.addEventListener('click', e => { e.stopPropagation(); toggle(); }));
  if (ui.area) ui.area.addEventListener('click', toggle);
  const seekTo = rel => { if (!widget || !duration) return; rel = Math.max(0, Math.min(1, rel)); widget.seekTo(rel * duration * 1000); draw(rel); };
  const fromClick = (el, e) => { const b = el.getBoundingClientRect(); seekTo((e.clientX - b.left) / b.width); };
  ui.seek.addEventListener('click', e => fromClick(ui.seek, e));
  ui.wave.addEventListener('click', e => fromClick(ui.wave, e));
  ui.seek.addEventListener('keydown', e => {
    if (!duration) return;
    const now = parseFloat(ui.fill.style.width) / 100 || 0, step = 5 / duration;
    if (e.key === 'ArrowRight') { seekTo(now + step); e.preventDefault(); }
    if (e.key === 'ArrowLeft') { seekTo(now - step); e.preventDefault(); }
  });
  /* warm up the widget when the visitor gets close to a play button */
  [...buttons, ui.area].filter(Boolean).forEach(b => b.addEventListener('pointerenter', () => load().catch(() => {}), { once: true }));
  /* touch screens have no hover: get it ready as soon as the page is idle, so a tap starts it straight away */
  if (matchMedia('(hover: none)').matches) (window.requestIdleCallback || (fn => setTimeout(fn, 1200)))(() => load().catch(() => {}));
}

/* Floating particles in the release colour; they speed up while the track plays */
function particles(canvas) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const ctx = canvas.getContext('2d');
  let w = 0, h = 0, dpr = 1, dots = [], raf = 0, rgb = '255, 255, 255';
  const resize = () => {
    dpr = 1;
    w = canvas.clientWidth; h = canvas.clientHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(Math.min(55, w * h / 22000));
    dots = Array.from({ length: n }, () => ({
      x: Math.random() * w, y: Math.random() * h,
      r: 0.6 + Math.random() * 1.8, s: 0.15 + Math.random() * 0.45,
      d: (Math.random() - 0.5) * 0.25, a: 0.15 + Math.random() * 0.55, t: Math.random() * Math.PI * 2,
    }));
  };
  let last = 0;
  const frame = (t = 0) => {
    if (t - last < 32) { raf = requestAnimationFrame(frame); return; }   /* ~30 fps is plenty for slow dots */
    const k = last ? Math.min(3, (t - last) / 16.7) : 1; last = t;
    const boost = (document.body.classList.contains('is-playing') ? 2.6 : 1) * k;
    ctx.clearRect(0, 0, w, h);
    for (const p of dots) {
      p.y -= p.s * boost; p.x += p.d * boost; p.t += 0.02 * boost;
      if (p.y < -6) { p.y = h + 6; p.x = Math.random() * w; }
      if (p.x < -6) p.x = w + 6; if (p.x > w + 6) p.x = -6;
      const a = p.a * (0.55 + 0.45 * Math.sin(p.t));
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${rgb}, ${a})`;
      ctx.fill(); ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 3, 0, Math.PI * 2); ctx.fillStyle = `rgba(${rgb}, ${a * 0.12})`;
      ctx.fill();
    }
    raf = requestAnimationFrame(frame);
  };
  resize(); addEventListener('resize', resize);
  /* only animate while the section is on screen */
  new IntersectionObserver(([e]) => { cancelAnimationFrame(raf); if (e.isIntersecting) raf = requestAnimationFrame(frame); }).observe(canvas);
  return { color(c) { rgb = c; } };
}

/* waveform bars, same placeholder shape as the home player */
function fillWave(el, seed) {
  const n = Math.max(16, Math.floor((el.clientWidth + 3) / 6));
  let html = '';
  for (let i = 0; i < n; i++) {
    const h = 6 + Math.round(18 * Math.abs(Math.sin(i * 0.45 + seed) * Math.cos(i * 0.13 + seed * 2)));
    html += `<span style="height:${h}px;--i:${i}"></span>`;
  }
  const on = el.querySelectorAll('.on').length / (el.children.length || 1);
  el.innerHTML = html;
  const upto = Math.round(on * n);
  [...el.children].forEach((b, i) => b.classList.toggle('on', i < upto));
}

/* animations stop while the top of the page is off screen */
new IntersectionObserver(([e]) => e.target.classList.toggle('is-off', !e.isIntersecting), { rootMargin: '100px 0px' }).observe(document.querySelector('.rel-bg'));

/* ── build the page ── */
(async () => {
  let releases;
  try {
    releases = await (window.HZ_RELEASES || fetch('./releases.json', { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }));
    if (!Array.isArray(releases) || !releases.length) throw new Error('empty');
  } catch (err) {
    document.getElementById('head').innerHTML = '<p style="color:#ef4444;font-size:0.75rem;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;">Could not load this release.</p>';
    return;
  }

  const id = new URLSearchParams(location.search).get('id');
  let i = releases.findIndex(r => r.id === id);
  if (i < 0 && id) {
    /* a link to a release that does not exist (typo, or removed): say so instead of showing another release */
    document.title = 'Release not found | HORIZON RCRDS';
    applyAccentColor(safeColor(releases[0].color));
    document.getElementById('rel').innerHTML = `
      <div class="intro" style="grid-column:1/-1;text-align:center;padding:40px 0;">
        <div class="label-tag flex items-center justify-center gap-3 mb-5"><span class="pulse-dot"></span><span>${escHtml(id)}</span></div>
        <h1 class="hero-title">RELEASE NOT FOUND</h1>
        <p class="hr-artist" style="justify-content:center;margin-top:18px;">This release doesn't exist or is no longer available.</p>
        <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:30px;">
          <a class="btn-outline" href="./catalogue"><i class="fa-solid fa-arrow-right"></i> Full catalogue</a>
          <a class="btn-outline" href="./"><i class="fa-solid fa-arrow-left"></i> Home</a>
        </div>
      </div>`;
    return;
  }
  if (i < 0) i = 0;
  const r = releases[i];
  const color = safeColor(r.color);
  const cat = r.catalog_number || r.catalog || '';
  applyAccentColor(color);

  document.title = `${r.artist ? r.artist + ' — ' : ''}${r.title} | HORIZON RCRDS`;
  document.querySelector('meta[name="description"]').content = `${r.title} by ${r.artist}. Listen on Spotify, SoundCloud and every platform. ${cat} — HORIZON RCRDS.`;

  /* cover + animated background */
  const cover = document.getElementById('cover');
  const bgCover = document.getElementById('bg-cover');
  cover.onload = () => { cover.style.opacity = '1'; bgCover.classList.add('on'); };
  cover.alt = `${r.title} cover`;
  cover.fetchPriority = 'high';   /* the cover is the first thing that must arrive */
  cover.src = imgPath(r.image);
  bgCover.style.backgroundImage = `url("${imgPath(r.image).replace(/"/g, '%22')}")`;
  const dots = particles(document.getElementById('bg-particles'));
  if (dots) dots.color(rgbStr(color));

  /* title block */
  document.querySelector('#tag span:last-child').textContent = i === 0 ? 'Latest release · Out now' : 'Out now';
  document.getElementById('head').innerHTML = `
    <h1 class="hero-title">${escHtml(r.title || 'Untitled')}</h1>
    <p class="hr-artist">${r.artist ? `<span>${escHtml(r.artist)}</span>` : ''}${cat ? `<span class="num-badge">${escHtml(cat)}</span>` : ''}</p>`;

  /* player */
  if (r.soundcloud_link) {
    const ui = { box: document.getElementById('player'), play: document.getElementById('play'), wave: document.getElementById('wave'),
                 seek: document.getElementById('seek'), fill: document.getElementById('fill'), cur: document.getElementById('cur'), dur: document.getElementById('dur'),
                 extra: [document.getElementById('cover-play')], area: document.getElementById('cover-box') };
    ui.box.hidden = false;
    document.getElementById('cover-play').hidden = false;
    const seed = [...(r.id || r.title || 'x')].reduce((a, c) => a + c.charCodeAt(0), 0) % 10;
    fillWave(ui.wave, seed);
    addEventListener('resize', () => fillWave(ui.wave, seed));
    scPlayer(r.soundcloud_link, ui);
  }

  /* platforms */
  const rows = PLATFORMS.filter(p => r[p.key]).map(p => `
    <a class="platform" href="${escHtml(r[p.key])}" target="_blank" rel="noopener noreferrer" style="--pc:${p.color};--pc-rgb:${rgbStr(p.color)};--card-ink-p:${inkFor(p.color)}">
      <span class="ico"><i class="${p.icon}"></i></span>
      <span><span class="name">${p.name}</span><span class="sub">${p.sub}</span></span>
      <span class="go">${p.key === 'beatport_link' ? 'Buy' : 'Play'} <i class="fa-solid fa-arrow-right" style="font-size:0.6rem"></i></span>
    </a>`);
  if (r.stream_link) rows.push(`
    <a class="platform main" href="${escHtml(r.stream_link)}" target="_blank" rel="noopener noreferrer">
      <span class="ico" style="--pc:var(--accent-color);--pc-rgb:var(--accent-color-rgb)"><i class="fa-solid fa-link"></i></span>
      <span><span class="name">All platforms</span><span class="sub">Apple Music, Deezer, Tidal, Amazon &amp; more</span></span>
      <span class="go">Open <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:0.6rem"></i></span>
    </a>`);
  document.getElementById('platforms').innerHTML = rows.join('');

  /* share */
  document.getElementById('share').addEventListener('click', async () => {
    /* the shared link is the clean one, without "&from=…" */
    const url = `${location.origin}${location.pathname}?id=${encodeURIComponent(r.id)}`;
    const data = { title: `${r.artist} — ${r.title}`, text: `${r.title} by ${r.artist} on HORIZON RCRDS`, url };
    if (navigator.share) { try { await navigator.share(data); } catch (e) {} return; }
    try { await navigator.clipboard.writeText(data.url); } catch (e) {}
    const t = document.getElementById('toast'); t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1800);
  });

  /* cover follows the mouse a little, like on the home page */
  const stage = document.querySelector('.stage'), tilt = document.getElementById('stage');
  if (matchMedia('(hover: hover) and (pointer: fine)').matches && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    stage.addEventListener('pointermove', e => {
      const b = stage.getBoundingClientRect();
      tilt.style.transform = `rotateY(${((e.clientX - b.left) / b.width - 0.5) * 10}deg) rotateX(${-((e.clientY - b.top) / b.height - 0.5) * 8}deg)`;
    });
    stage.addEventListener('pointerleave', () => { tilt.style.transform = ''; });
  }

  /* reveal */
  const obs = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); }), { threshold: 0.08 });
  document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
})();
</script>
<script>
/* centrado exacto de botones con letras espaciadas: se quita el hueco que deja la última letra */
(function () {
  var SEL = '.btn-primary, .btn-outline, .share-btn';
  function fix(root) {
    (root.matches && root.matches(SEL) ? [root] : []).concat([].slice.call(root.querySelectorAll ? root.querySelectorAll(SEL) : [])).forEach(function (b) {
      [].slice.call(b.childNodes).forEach(function (n) {
        if (n.nodeType !== 3 || !n.textContent.trim()) return;
        var s = document.createElement('span'); s.className = 'lsx'; n.parentNode.replaceChild(s, n); s.appendChild(n);
      });
    });
  }
  fix(document);
  new MutationObserver(function (ms) { ms.forEach(function (m) { m.addedNodes.forEach(function (n) { if (n.nodeType === 1) fix(n); }); }); }).observe(document.body, { childList: true, subtree: true });
})();
</script>
</body>
