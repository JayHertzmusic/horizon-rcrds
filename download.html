<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free download — HORIZON RCRDS</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon_icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --acc: #ff5500; --bg: #08080a; --text: #f4f4f5; --soft: #a9a9b2; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--bg); color: var(--text); font: 400 16px/1.6 'Barlow', system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  #bg { position: fixed; inset: -60px; background-size: cover; background-position: center; filter: blur(60px) saturate(1.4) brightness(.5); transform: scale(1.15); z-index: -2; opacity: 0; transition: opacity .6s; }
  #bg.on { opacity: 1; }
  #tint { position: fixed; inset: 0; background: radial-gradient(120% 80% at 50% 0%, transparent, rgba(0,0,0,.5) 65%, rgba(0,0,0,.92)); z-index: -1; }
  main { width: min(440px, 100%); margin: 0 auto; padding: 30px 18px 56px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .brand { display: inline-flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; margin-bottom: 26px; opacity: .9; }
  .brand img { height: 24px; }
  .brand span { font: 400 17px/1 'Bebas Neue', sans-serif; letter-spacing: .16em; margin-right: -.16em; }
  .cover { width: min(86vw, 400px); aspect-ratio: 1; border-radius: 18px; object-fit: cover; background: #000;
    box-shadow: 0 30px 70px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.07), 0 12px 90px -10px var(--acc); }
  .eyebrow { margin: 26px 0 0; font: 700 11px/1 'Barlow', sans-serif; letter-spacing: .3em; text-transform: uppercase; color: var(--acc); }
  h1 { font: 400 clamp(40px, 11vw, 60px)/.92 'Bebas Neue', sans-serif; margin: 12px 0 2px; }
  .artist { color: var(--soft); font-size: 16px; margin: 0; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 11px; width: 100%; margin-top: 26px; padding: 18px 20px; border: 0; border-radius: 12px;
    font: 700 14px/1 'Barlow', sans-serif; letter-spacing: .1em; text-transform: uppercase; cursor: pointer; text-decoration: none; transition: transform .1s, box-shadow .2s, opacity .2s; }
  .btn:active { transform: translateY(1px); }
  .btn.sc { background: linear-gradient(180deg, #ff6a2b, #ff4d00); color: #fff; box-shadow: 0 14px 34px -8px rgba(255,80,0,.75); }
  .btn.sc:disabled { opacity: .5; box-shadow: none; cursor: default; }
  .btn.dl { background: #fff; color: #0a0a0b; box-shadow: 0 14px 36px -8px rgba(255,255,255,.45); }
  .note { margin: 16px 2px 0; font-size: 12px; line-height: 1.55; color: #8a8a93; max-width: 380px; }
  .err { color: #ff6b6b; font-size: 13.5px; margin: 16px 0 0; }
  .ok-badge { display: inline-flex; align-items: center; gap: 7px; margin-top: 26px; color: #22c55e; font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
  .done-msg { color: var(--soft); font-size: 14px; margin: 10px 0 0; }
  .foot { margin-top: 24px; font-size: 11px; letter-spacing: .1em; color: #6b6b74; }
  .foot a { color: var(--soft); text-decoration: none; }
  .msg { color: var(--soft); }
</style>
</head>
<body>
<div id="bg"></div><div id="tint"></div>
<main id="root"><p class="msg">Loading…</p></main>
<script>
(() => {
  const root = document.getElementById('root'), bg = document.getElementById('bg');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const id = (location.pathname.match(/^\/download\/([\w-]+)/) || [])[1] || '';
  const params = new URLSearchParams(location.search);
  const brand = '<a class="brand" href="/"><img src="/assets/logo.png" alt=""><span>HORIZON RCRDS</span></a>';
  const img = f => !f ? '' : /^(https?:|\/)/.test(f) ? f : '/assets/' + f;
  const scLogo = '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M1 15a1 1 0 0 0 2 0v-4a1 1 0 0 0-2 0zm3 1a1 1 0 0 0 2 0V9a1 1 0 0 0-2 0zm3 0a1 1 0 0 0 2 0V8a1 1 0 0 0-2 0zm3 .5a1 1 0 0 0 2 0V7a1 1 0 0 0-2 0zm3 0a1 1 0 0 0 2 0V8.5a1 1 0 0 0-2 0zM18 17h4a3 3 0 0 0 0-6 4.5 4.5 0 0 0-8.4-1.6V17z"/></svg>';

  async function load() {
    if (!id) { root.innerHTML = brand + '<p class="msg">This download link is not valid.</p>'; return; }
    let d;
    try {
      const r = await fetch('/api/public/download/' + encodeURIComponent(id), { cache: 'no-store' });
      d = await r.json();
      if (!r.ok) throw new Error(d.message || 'This download is not available.');
    } catch (e) { root.innerHTML = brand + '<p class="msg">' + esc(e.message) + '</p>'; return; }

    if (d.color && /^#[0-9a-f]{3,6}$/i.test(d.color)) document.documentElement.style.setProperty('--acc', d.color);
    if (d.image) { bg.style.backgroundImage = `url("${img(d.image).replace(/"/g, '%22')}")`; bg.classList.add('on'); }
    document.title = (d.artist ? d.artist + ' – ' : '') + (d.title || 'Download') + ' — HORIZON RCRDS';

    const head = brand +
      (d.image ? '<img class="cover" src="' + esc(img(d.image)) + '" alt="">' : '') +
      '<p class="eyebrow">Free download</p>' +
      '<h1>' + esc(d.title || 'Download') + '</h1>' +
      (d.artist ? '<p class="artist">' + esc(d.artist) + '</p>' : '');

    if (params.get('done') === '1') {
      root.innerHTML = head +
        '<span class="ok-badge">✓ Connected</span>' +
        '<p class="done-msg">Thanks for joining the chain — your download is ready.</p>' +
        '<a class="btn dl" href="/api/public/download/' + encodeURIComponent(id) + '/file">↓ Download</a>' +
        '<p class="foot"><a href="/">horizonrcrds.com</a></p>';
      return;
    }
    const error = params.get('error');
    root.innerHTML = head +
      '<button class="btn sc" id="go">' + scLogo + 'Connect with SoundCloud</button>' +
      (error ? '<p class="err">' + esc(error) + '</p>' : '') +
      '<p class="note">' + esc(d.notice || '') + '</p>' +
      '<p class="foot"><a href="/">horizonrcrds.com</a></p>';

    document.getElementById('go').addEventListener('click', e => { const b = e.currentTarget; b.disabled = true; b.textContent = 'Connecting…'; location.href = '/api/sc/login?r=' + encodeURIComponent(id); });
  }
  load();
})();
</script>
</body>
</html>
