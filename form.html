  .send { text-indent: .24em; }
  html.embed .send { text-indent: .22em; }
  /* ===== Formulario privado (enlace personal): pantalla completa — pasos a la izquierda, preguntas en columnas ===== */
  html.excl body::before { background: radial-gradient(900px 600px at 0% 0%, rgba(255, 255, 255, .07), transparent 70%), radial-gradient(800px 600px at 100% 100%, rgba(255, 255, 255, .035), transparent 70%); }
  html.excl header.top, html.excl footer.sig { display: none; }

  .xa { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 100vh; }

  .xa-head h2 { margin: 0; font: 400 clamp(36px, 4vw, 54px)/.95 'Bebas Neue', sans-serif; letter-spacing: .03em; color: #fff; }

  html.excl .q { margin: 0; padding: 0; border: 0; border-radius: 0; background: none; }
  html.excl .q > label, html.excl .q > .lbl { display: flex; align-items: baseline; gap: 8px; margin: 0 0 6px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #fff; }

  html.excl .q:focus-within .help { -webkit-line-clamp: unset; }
  html.excl .q > label + input, html.excl .q > label + textarea, html.excl .q > label + select { margin-top: 0; }
  html.excl { --box: 52px; }

  html.excl input[type=text], html.excl input[type=email], html.excl input[type=url], html.excl select { padding: 12px 14px; border: 1px solid #2a2a2a; border-radius: 8px; background: rgba(255, 255, 255, .03); }

  /* opciones: botones iguales en una fila (sin circulitos); el elegido se pone blanco */

  html.excl .opt { position: relative; justify-content: center; gap: 8px; height: var(--box); min-height: 0; padding: 0 10px; border: 1px solid #2a2a2a; border-radius: 8px; background: rgba(255, 255, 255, .03); font-size: 12.5px; font-weight: 600; line-height: 1.25; text-align: center; color: #cfcfcf; transition: background .15s, color .15s, border-color .15s; }

  html.excl .opt:has(input:focus-visible) { outline: 2px solid #fff; outline-offset: 2px; }

</style>
<script>/* incrustado en la portada: modo compacto desde el primer instante (sin enseñar la página completa) */
if (/[?&]embed=1/.test(location.search) && window.parent !== window) document.documentElement.classList.add('embed');</script>
</head>
<body>
<div class="bar" id="bar" aria-hidden="true"></div>
<header class="top"><a class="home" href="/"><img src="/assets/logo.png" alt=""><span>HORIZON RCRDS</span></a></header>
<main>
  <div id="root"><p class="msg">Loading…</p></div>
</main>
<footer class="sig">© HORIZON RCRDS</footer>
<script>
(() => {
  const root = document.getElementById('root');
  const PREVIEW = new URLSearchParams(location.search).has('preview');
  const EMBED = new URLSearchParams(location.search).has('embed') && parent !== window;
  if (EMBED) {
    document.documentElement.classList.add('embed');
    const acc = new URLSearchParams(location.search).get('accent');
    if (/^#[0-9a-f]{3,6}$/i.test(acc || '')) document.documentElement.style.setProperty('--acc', acc);
    // la portada ajusta el alto del recuadro al del formulario
    const tell = () => parent.postMessage({ type: 'hz-form-h', h: Math.ceil(document.querySelector('main').getBoundingClientRect().height) }, location.origin);
    new ResizeObserver(tell).observe(document.querySelector('main'));
    addEventListener('load', tell);
  }
  if (PREVIEW) document.documentElement.classList.add('preview');
  const slug = (location.pathname.match(/^\/forms\/([a-z0-9-]+)/) || [])[1] || new URLSearchParams(location.search).get('f') || '';
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const linky = s => esc(s).replace(/https?:\/\/[^\s<>"']+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
  let form = null;

  // preguntas cortas seguidas van de dos en dos (como en un formulario de escritorio)
  const SHORT = new Set(['text', 'email', 'url', 'select']);
  function halves(fields) {
    const out = new Set();
    for (let i = 0; i < fields.length - 1; i++) {
      const a = fields[i], b = fields[i + 1];
      if (SHORT.has(a.type) && SHORT.has(b.type)) { out.add(a.id); out.add(b.id); i++; }
    }
    return out;
  }
  let HALF = new Set();
  function field(f) {
    if (f.type === 'section') return `<div class="sec"><h2>${esc(f.label)}</h2>${f.help ? `<p>${linky(f.help)}</p>` : ''}</div>`;
    const id = 'f-' + f.id, req = f.required ? '<span class="req" aria-hidden="true">*</span>' : '';
    const help = f.help ? `<p class="help" id="${id}-h">${linky(f.help)}</p>` : '';
    const aria = `${f.required ? 'required aria-required="true"' : ''} ${f.help ? `aria-describedby="${id}-h"` : ''}`;
    let input;
    if (f.type === 'textarea') input = `<textarea id="${id}" name="${esc(f.id)}" ${aria} maxlength="8000" placeholder="Your answer"></textarea>`;
    else if (f.type === 'select') input = `<select id="${id}" name="${esc(f.id)}" ${aria}><option value="">Choose…</option>${(f.options || []).map(o => `<option>${esc(o)}</option>`).join('')}</select>`;
    else if (f.type === 'radio' || f.type === 'checkbox') {
      input = `<div class="opts" role="${f.type === 'radio' ? 'radiogroup' : 'group'}" aria-labelledby="${id}-l">${(f.options || []).map(o => `
        <label class="opt"><input type="${f.type}" name="${esc(f.id)}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join('')}
        ${f.other ? `<label class="opt"><input type="${f.type}" name="${esc(f.id)}" value="__other"><span>Other:</span><input type="text" data-other="${esc(f.id)}" maxlength="300" aria-label="Other"></label>` : ''}</div>`;
      return `<div class="q" data-q="${esc(f.id)}"><span class="lbl" id="${id}-l">${esc(f.label)}${req}</span>${help}${input}</div>`;
    } else input = `<input id="${id}" name="${esc(f.id)}" type="${f.type === 'email' ? 'email' : f.type === 'url' ? 'url' : 'text'}" ${aria} maxlength="1000" autocomplete="${f.type === 'email' ? 'email' : 'off'}" placeholder="${f.type === 'url' ? 'https://' : f.type === 'email' ? 'name@email.com' : 'Your answer'}">`;
    return `<div class="q${HALF.has(f.id) ? ' half' : ''}" data-q="${esc(f.id)}"><label for="${id}">${esc(f.label)}${req}</label>${help}${input}</div>`;
  }
  // privado con enlace personal: portada de invitación y una sección por paso
  const EXCL = () => !!form?.invite && !PREVIEW && !EMBED;
  let steps = [], cur = 0;
  function stepsOf(fields) {
    const out = [];
    for (const x of fields) {
      if (x.type === 'section') { out.push({ title: x.label, sec: x, fields: [] }); continue; }
      if (!out.length) out.push({ title: 'About you', sec: null, fields: [] });
      out[out.length - 1].fields.push(x);
    }
    return out.filter(st => st.fields.length);
  }
  const plain = t => String(t || '').replace(/[^\p{L}\p{N}&,'’ .()!?-]+/gu, ' ').replace(/\s+/g, ' ').trim();
  function drawExcl() {
    document.documentElement.classList.add('excl');
    document.title = `${form.title || 'Form'} — HORIZON RCRDS`;
    steps = stepsOf(form.fields);
    let n = 0;
    const num = x => `<span class="x-qn">${String(++n).padStart(2, '0')}</span>`;
    // todo en columnas (solo las preguntas con muchas opciones ocupan el ancho entero)
    // todas las preguntas con su línea de ayuda (aunque esté vacía): así los recuadros quedan alineados en cada fila
    const withHelp = h => /class="help"/.test(h) ? h : h.replace(/<(input|textarea|select|div class="opts")/, '<p class="help" aria-hidden="true"></p>$&');
    const q = x => withHelp(field(x)).replace(/^<div class="q( half)?"/, `<div class="q${(x.type === 'radio' || x.type === 'checkbox') && (x.options || []).length > 4 ? ' wide' : ''}"`).replace(/(<label for="[^"]+">|<span class="lbl" id="[^"]+">)/, m => m + num(x));
    const qCount = st => `${st.fields.length} question${st.fields.length > 1 ? 's' : ''}`;
    root.innerHTML = `
      <div class="xa">
        <aside class="xa-side">
          <a class="xa-brand" href="/"><img src="/assets/logo.png" alt=""><span>HORIZON RCRDS</span></a>
          <span class="x-badge"><i></i>Private invitation</span>
          <h1>${esc(form.title || 'Form')}</h1>
          ${form.note ? `<p class="x-for">Prepared for <b>${esc(form.note)}</b></p>` : ''}
          <ol class="x-steps">${steps.map((st, i) => `<li data-go="${i}"><span class="n"><b>${i + 1}</b></span><span class="t">${esc(plain(st.title) || 'Step ' + (i + 1))}</span><small>${qCount(st)}</small></li>`).join('')}</ol>
          <div class="xa-prog"><div><i id="x-bar"></i></div><small id="x-pct">0% done</small></div>
          ${form.description ? `<details class="xa-about"><summary>About this form</summary><p>${linky(form.description)}</p></details>` : ''}
          <p class="x-note">This link is personal: it only works for you, once, on this device.</p>
        </aside>
        <section class="xa-main">
          <form id="f" novalidate>
            ${steps.map((st, i) => `<section class="step" data-step="${i}">
              <header class="xa-head"><span class="x-num">Step ${i + 1} of ${steps.length}</span><h2>${esc(plain(st.sec ? st.sec.label : st.title))}</h2>${st.sec?.help ? `<p>${linky(st.sec.help)}</p>` : ''}</header>
              <div class="xa-grid">${st.fields.map(q).join('')}</div>
            </section>`).join('')}
            <div class="hp" aria-hidden="true"><label>Leave empty <input name="_hp" tabindex="-1" autocomplete="off"></label></div>
            <p class="err" id="err" role="alert" hidden></p>
            <div class="x-nav"><button type="button" class="ghost" data-back>Back</button><small id="x-pos"></small><button type="button" class="send" data-next>Next</button></div>
          </form>
        </section>
      </div>`;
    goStep(0, false);
  }
  function goStep(i, scroll = true) {
    cur = Math.max(0, Math.min(steps.length - 1, i));
    document.querySelectorAll('.step').forEach(el => el.classList.toggle('on', Number(el.dataset.step) === cur));
    document.querySelectorAll('.x-steps li').forEach((li, k) => { li.classList.toggle('on', k === cur); li.classList.toggle('past', k < cur); });
    const last = cur === steps.length - 1, next = document.querySelector('[data-next]');
    next.textContent = last ? 'Send' : 'Next'; next.type = last ? 'submit' : 'button';
    document.querySelector('[data-back]').hidden = cur === 0;
    document.getElementById('x-pos').textContent = `${cur + 1} / ${steps.length}`;
    document.getElementById('err').hidden = true;
    progress();
    if (scroll) window.scrollTo({ top: 0, behavior: 'smooth' });
    document.querySelector('.step.on input, .step.on textarea, .step.on select')?.focus({ preventScroll: true });
  }
  // lo obligatorio de un paso, antes de pasar al siguiente
  function stepMissing(i) {
    const a = answers(document.getElementById('f'));
    return steps[i].fields.find(x => x.required && (!a[x.id] || (Array.isArray(a[x.id]) && !a[x.id].length)));
  }
  function markMissing(x) {
    const f = document.getElementById('f'), q = f.querySelector(`[data-q="${CSS.escape(x.id)}"]`), err = document.getElementById('err');
    q.classList.add('bad'); q.scrollIntoView({ block: 'center', behavior: 'smooth' });
    err.textContent = `Please answer “${x.label.trim()}”.`; err.hidden = false;
  }
  document.addEventListener('click', e => {
    if (!EXCL()) return;
    if (e.target.closest('[data-back]')) { goStep(cur - 1); return; }
    const nx = e.target.closest('[data-next]');
    if (nx && nx.type === 'button') {
      document.querySelectorAll('.q.bad').forEach(q => q.classList.remove('bad'));
      const m = stepMissing(cur);
      if (m) { markMissing(m); return; }
      goStep(cur + 1); return;
    }
    const li = e.target.closest('.x-steps li');
    if (li) {
      const to = Number(li.dataset.go);
      if (to > cur) { for (let k = cur; k < to; k++) { const m = stepMissing(k); if (m) { goStep(k); markMissing(m); return; } } }
      goStep(to);
    }
  });
  function draw(closed, target = root) {
    if (target === root && EXCL()) return drawExcl();
    document.title = `${form.title || 'Form'} — HORIZON RCRDS`;
    const hasReq = form.fields.some(x => x.required);
    HALF = halves(form.fields);
    target.innerHTML = `<p class="eyebrow">HORIZON RCRDS</p><h1>${esc(form.title || 'Untitled form')}</h1>
      ${closed ? '<p style="text-align:center"><span class="closed">Closed — preview</span></p>' : ''}
      ${form.description ? `<p class="desc">${linky(form.description)}</p>` : ''}
      <form id="f" novalidate>
        ${form.fields.map(field).join('')}
        <div class="hp" aria-hidden="true"><label>Leave empty <input name="_hp" tabindex="-1" autocomplete="off"></label></div>
        <p class="err" id="err" role="alert" hidden></p>
        <div class="foot"><button class="send" type="submit">Send</button>${hasReq ? '<small>* Required</small>' : ''}</div>
      </form>`;
    if (target === root) progress();
  }
  // enlace personal (formularios privados): ?k=… y una clave de este dispositivo (el enlace solo vale en el primero que lo abre)
  const KEY = new URLSearchParams(location.search).get('k') || '';
  const device = (() => {
    if (!KEY) return '';
    const name = 'hz_fd_' + KEY.slice(0, 24);
    let v = ''; try { v = localStorage.getItem(name) || ''; } catch { /* nada */ }
    if (!v) { const u = crypto.getRandomValues(new Uint8Array(24)); v = btoa(String.fromCharCode(...u)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); try { localStorage.setItem(name, v); } catch { /* nada */ } }
    return v;
  })();
  const linkHeaders = KEY ? { 'X-Form-Device': device } : {};
  const apiUrl = () => '/api/public/forms/' + encodeURIComponent(slug) + (KEY ? '?k=' + encodeURIComponent(KEY) : '');
  async function load() {
    try {
      const r = await fetch(apiUrl(), { cache: 'no-store', headers: linkHeaders });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.message || 'This form is not available.');
      form = j; draw(false);
    } catch (e) { root.innerHTML = `<h1>Not available</h1><p class="msg">${esc(e.message)}</p>`; }
  }
  // vista previa del panel: el formulario llega del editor (mismo sitio) y se redibuja al momento
  let lastFocus = '';
  function morph(a, b) {
    for (const { name } of [...a.attributes]) if (!b.hasAttribute(name)) a.removeAttribute(name);
    for (const { name, value } of [...b.attributes]) if (a.getAttribute(name) !== value) a.setAttribute(name, value);
    const ac = [...a.childNodes], bc = [...b.childNodes];
    for (let i = 0; i < Math.max(ac.length, bc.length); i++) {
      const x = ac[i], y = bc[i];
      if (!y) { x.remove(); continue; }
      if (!x) { a.appendChild(y.cloneNode(true)); continue; }
      if (x.isEqualNode(y)) continue;
      if (x.nodeType === 1 && y.nodeType === 1 && x.tagName === y.tagName && !/^(INPUT|TEXTAREA|SELECT|IMG)$/.test(x.tagName)) morph(x, y);
      else if (x.nodeType === 3 && y.nodeType === 3) x.nodeValue = y.nodeValue;
      else x.replaceWith(y.cloneNode(true));
    }
  }
  if (PREVIEW) {
    window.addEventListener('message', e => {
      if (e.origin !== location.origin || e.data?.type !== 'hz-form') return;
      form = e.data.form;
      // solo se cambia lo que ha cambiado (sin redibujar todo: así no parpadea ni salta)
      if (!root.querySelector('#f')) draw(!form.public);
      else { const fresh = document.createElement('main'); draw(!form.public, fresh); morph(root, fresh); progress(); }
      // solo se desplaza al pasar a otra pregunta, y solo si no se ve ya
      if (e.data.focus && e.data.focus !== lastFocus) {
        lastFocus = e.data.focus;
        const q = document.querySelector(`[data-q="${CSS.escape(e.data.focus)}"]`);
        const b = q?.getBoundingClientRect();
        if (b && (b.top < 0 || b.bottom > innerHeight)) q.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }
    });
    root.innerHTML = '<p class="msg">Preview…</p>';
    parent.postMessage({ type: 'hz-form-ready' }, location.origin);
  }

  function answers(f) {
    const out = {};
    for (const x of form.fields) {
      if (x.type === 'section') continue;
      if (x.type === 'checkbox') {
        out[x.id] = [...f.querySelectorAll(`input[name="${CSS.escape(x.id)}"]:checked`)].map(i => i.value === '__other' ? f.querySelector(`[data-other="${CSS.escape(x.id)}"]`).value.trim() : i.value).filter(Boolean);
      } else if (x.type === 'radio') {
        const c = f.querySelector(`input[name="${CSS.escape(x.id)}"]:checked`);
        out[x.id] = !c ? '' : c.value === '__other' ? f.querySelector(`[data-other="${CSS.escape(x.id)}"]`).value.trim() : c.value;
      } else out[x.id] = (f.elements[x.id]?.value || '').trim();
    }
    return out;
  }
  function progress() {
    const f = document.getElementById('f'), bar = document.getElementById('bar');
    if (!f || !form) return;
    const qs = form.fields.filter(x => x.type !== 'section'), a = answers(f);
    const n = qs.filter(x => Array.isArray(a[x.id]) ? a[x.id].length : a[x.id]).length;
    bar.style.width = qs.length ? `${(n / qs.length) * 100}%` : '0';
    const pct = qs.length ? Math.round((n / qs.length) * 100) : 0, xb = document.getElementById('x-bar'), xp = document.getElementById('x-pct');
    if (xb) xb.style.width = pct + '%'; if (xp) xp.textContent = `${pct}% done`;
  }

  document.addEventListener('submit', async e => {
    e.preventDefault();
    if (PREVIEW) return;
    const f = e.target, err = document.getElementById('err'), btn = f.querySelector('.send');
    const a = answers(f);
    f.querySelectorAll('.q.bad').forEach(q => q.classList.remove('bad'));
    const missing = form.fields.find(x => x.required && (!a[x.id] || (Array.isArray(a[x.id]) && !a[x.id].length)));
    if (missing && EXCL()) { const k = steps.findIndex(st => st.fields.includes(missing)); if (k >= 0 && k !== cur) goStep(k, false); markMissing(missing); return; }
    if (missing) {
      const q = f.querySelector(`[data-q="${CSS.escape(missing.id)}"]`);
      q.classList.add('bad'); q.scrollIntoView({ block: 'center', behavior: 'smooth' });
      err.textContent = `Please answer “${missing.label.trim()}”.`; err.hidden = false;
      return;
    }
    btn.disabled = true; btn.textContent = 'Sending…'; err.hidden = true;
    try {
      const r = await fetch(apiUrl(), { method: 'POST', headers: { 'Content-Type': 'application/json', ...linkHeaders }, body: JSON.stringify({ answers: a, _hp: f.elements._hp.value, k: KEY }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.message || 'Something went wrong. Please try again.');
      document.getElementById('bar').style.width = '100%';
      if (EMBED) parent.postMessage({ type: 'hz-form-sent' }, location.origin);
      root.innerHTML = EXCL()
        ? `<div class="done"><span class="x-badge"><i></i>Received</span><h2 style="margin-top:22px">Thank you${form.note ? ', ' + esc(form.note) : ''}!</h2><p>Your details are with HORIZON RCRDS.<br>We’ll prepare everything for your release and be in touch soon.</p><a href="/">Back to the website</a></div>`
        : `<div class="done"><h2>Thank you!</h2><p>Your answer has been sent to HORIZON RCRDS.<br>We’ll get back to you soon.</p><a href="/">Back to the website</a></div>`;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (x) { err.textContent = x.message; err.hidden = false; btn.disabled = false; btn.textContent = 'Send'; }
  });
  document.addEventListener('input', e => {
    const o = e.target.closest('[data-other]');
    if (o && o.value) { const r = o.closest('.opt').querySelector('input[type=radio], input[type=checkbox]'); if (r) r.checked = true; }
    e.target.closest('.q')?.classList.remove('bad');
    progress();
  });
  document.addEventListener('change', progress);
  if (!PREVIEW) load();
})();
</script>
</body>
</html>
